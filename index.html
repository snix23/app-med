  {id:"neo",course:1,icon:"flask",name:"Неорганическая химия",desc:"Лечебное дело, 1 курс. Контрольные вопросы с ответами",c:"180,200,150",cd:"90,120,60",tests:[],cards:[{"t":"Дайте определение скорости химической реакции. В каких единицах может измеряться скорость химической реакции","d":"Скорость химической реакции -- изменение концентрации одного из реагирующих веществ или продуктов реакции в единицу времени. Среднюю скорость реакции в промежутке времени от t1 до t2 рассчитывают следующим образом: Скорость химической реакции измеряется в моль/(лс), моль/(лмин) и т.п. Знак плюс берется при расчете скорости по продукту реакции, так как в ходе реакции концентрация продукта возрастает, с2 с1, с0.","sec":"neo"},{"t":"Что называется","d":"Молекулярность реакции – это минимальное число молекул, участвующих в элементарном химическом процессе. По молекулярности элементарные химические реакции делятся на молекулярные (А →) и бимолекулярные (А + В →); тримолекулярные реакции встречаются чрезвычайно редко.","sec":"neo"},{"t":"Какие факторы влияют на скорость химической реакции","d":"Скорость химической реакции зависит от природы и концентрации реагирующих веществ, температуры, присутствия катализатора, площади соприкосновения (для гетерогенных реакций).","sec":"neo"},{"t":"Запишите выражение закона действующих масс. Что называется порядком реакции, порядком реакции по веществу","d":"Для всякой химической реакции зависимость скорости реакции от концентраций реагирующих веществ выражается законом действующих масс: Показатель степени при концентрации называется порядком реакции по i-му веществу. Порядок реакции - сумма показателей степеней при концентрациях всех веществ в законе действующих масс (его также называют общим или суммарным). Для простых реакций показатель степени совпадает со стехиометрическим коэффициентом в уравнении реакции. Коэффициент пропорциональности k в законе действующих масс называется константой скорости.","sec":"neo"},{"t":"Запишите кинетическое уравнение реакции первого порядка. Как экспериментально можно определить константу скорости реакции первого порядка","d":"Кинетические уравнения - уравнения, связывающие скорость химической реакции с концентрациями, а также выражающие зависимость концентраций от времени. Кинетические уравнения реакций первого, второго и нулевого порядка | Порядок реакции | Выражение закона действующих масс | Единица измерения константы скорости | Зависимость концентрации от времени | Период полураспада |","sec":"neo"},{"t":"Что называется временем","d":"Период полураспада (t1/2) – время, в течение которого превращению подвергается половина взятого вещества. В приведенных в таблице уравнениях: С0 – начальная концентрация вещества, С – концентрация этого вещества в момент времени t.","sec":"neo"}]},
  {id:"bioc",course:1,icon:"flask",name:"Биоорганическая химия",desc:"Лечебное дело, 1 курс. Ответы на билеты к экзамену",c:"210,170,200",cd:"140,70,130",tests:[],cards:[{"t":"Предмет и задачи биоорганической химии. Органическая химия – фундаментальная основа биоорганической химии","d":"Биоорганическая химия изучает строение и биологические функции важнейших компонентов живой материи, в первую очередь биополимеров и низкомолекулярных биорегуляторов, уделяя главное внимание выяснению закономерностей взаимосвязи между структурой и биологически действием. К основным задачам биоорганической химии относят: выделение в индивидуальном состоянии изучаемых соединений; установление их структуры, включая пространственное строение;","sec":"bioc"},{"t":"Пиразолон-5 – основа ненаркотических анальгетиков (антипирин, амидопирин, анальгин). Барбитуровая кислота и её производная (барбит","d":"Пиразолон-5 (дииминоформа) Енольная форма – дииминоформа – Пиразолон-5 – пятичленный гетероциклический лактам, производное пиразола, содержащее дополнительную кетогруппу. Антипирин, амидопирин и анальгин можно рассматривать как производные пиразолона-5, находящегося в дииминоформе. Общая формула этой группы препаратов: При получении лекарственных средств пиразольного ряда в качестве исходного соединения используется ацетоуксусный эфир. Его конденсацией с фенилгидразином получают 1-фенил-3-метилпиразолон-5. Метилирование последнего ведет к антипирину. А. обладает ароматическим характером, нитрозируется в 4-е положение. Восстановление приводит ","sec":"bioc"},{"t":"Биологически важные классы органических соединений: спирты, фенолы, тиолы, эфиры, сульфиды, альдегиды, кетоны, карбоновые кислоты","d":"Спиртами называются производные углеводородов, в молекулах которых содержится одна или несколько – ОН групп, связанных с насыщенными атомами углерода. По числу гидроксогруппгрупп делятся на одноатомные и многоатомные. Свойства: образование алкоголятов, образование сложных и простых эфиров, галогенирование, внутримолекулярная дегадратация. Биологически важные: сорбит (гексангексаол), глицерин (пропантриол), бутиловые (С4Н9ОН) и амиловые (C5H11OH) спирты.","sec":"bioc"},{"t":"Алкалоиды. Метилированные ксантины (теобромин, теофиллин, кофеин). Представление о строении никотина, морфина, хинина, атропина","d":"Алкалоидами называют гетероциклические азотсодержащие основания растительного происхождения, обладающие выраженным физиологическим действием. Алкалоиды представляют собой третичные амины и содержатся в виде солей органических кислот. Алкалоиды – бесцветные кристаллические вещества горького вкуса, практически не растворимы в воде, но растворимые в органических растворителях – эфире, хлороформе и т.д. Соли их растворимы в воде и нерастворимы в органических растворителях. В основе структуры алкалоидов обычно лежит какой либо гетероцикл. К алкалоидам пуринового ряда относятся метилированные по азоту производные ксантина – 1,3,7-триметилксантин, и","sec":"bioc"},{"t":"Физико-химические методы выделения и исследования органических соединений, имеющих значение для биомедицинского анализа (экстракци","d":"Экстракция – процесс разделения смеси жидких или твёрдых веществ с помощью избирательных (селективных) растворителей (экстрагентов). Процесс экстракции включает 3 последовательные стадии: смешение исходной смеси веществ с экстрагентом; механическое разделение (расслаивание) двух образующихся фаз; удаление экстрагента из обеих фаз и его регенерацию с целью повторного использования. После механического разделения получают раствор извлекаемого вещества в экстрагенте (экстракт) и остаток исходного раствора (рафинат) или твёрдого вещества. Выделение экстрагированного вещества из экстракта и одновременно регенерация экстрагента производится дистилл","sec":"bioc"},{"t":"Аминокислоты, входящие в состав белков. Строение, номенклатура, стереоизомерия, кислотно-основные свойства, биполярная структура","d":"α-аминокислоты – гетерофункциональные соединения. Они обязательно содержат карбоксильную группу и аминогруппу, находящиеся у одного и того же углеродного атома. Названия α-аминокислот строятся по систематической номенклатуре, но обычно используют их тривиальные названия. Эти названия аминокислот чаще всего бывают связаны с источниками выделения или какими-то характерными свойствами (например, название «глицин» происходит от греч. «сладкий»). α-аминокислоты делятся на алифатические, ароматические и гетероциклические. С учетом общего числа карбоксильных и аминогрупп в молекуле, аминокислоты подразделяются на нейтральные, основные и кислые. Нахо","sec":"bioc"},{"t":"Докажите соответствие пурина критериям ароматичности. Обозначьте кислотные и основные центры в молекуле пурина","d":"Важнейшая конденсированная гетероциклическая система пурин состоит из двух сочлененных колец — имидазола и пиримидина. Пурин относится к ароматическим соединениям, он имеет плоский σ-скелет, его сопряженная система состоит из 10 р-электронов, включая неподеленную пару электронов атома N-7, что соответствует формуле Хюккеля (4n+2 при n=2). Пурин амфотерен благодаря имидазольному циклу и образует соли с сильными кислотами — за счет пиридиновых атомов азота и с основаниями — за счет NH-кислотного центра.","sec":"bioc"},{"t":"Структурной основой каких биологически важных веществ является пирокатехин (катехол)? Приведите формулу адреналина","d":"Пирокатехин Пирокатехин (о-дигидроксибензол), называемый также катехолом, является структурным фрагментом многих биологически активных веществ, в частности катехоламинов, к которым относятся: адреналин (или эпинефрин), норадреналин (или норэпинефрин), дофамин.","sec":"bioc"},{"t":"Важнейшие понятия стереохимии – конформация и конфигурация. Конформации открытых цепей. Проекционные формулы Ньюмена. Конформации","d":"Конформация молекулы — пространственное расположение атомов в молекуле определенной конфигурации, обусловленное поворотом вокруг одной или нескольких одинарных сигма-связей. Конфигурация молекул в стереохимии характеризует пространственное расположение атомов или групп атомов у асимметрического атома, у несимметрично замещенной двойной связи, у малого (жёсткого) цикла, у центрального атома в комплексах. Различия между конфигурациями молекул обусловливают существование двух видов устойчивых стереоизомеров — геометрических и оптических. Конфигурация молекулы не меняется при изменении её конформации, т.е. при повороте вокруг простых связей отдел","sec":"bioc"},{"t":"Биосинтетические пути образования α-аминокислот из кетонокислот: реакции восстановительного аминирования и реакции транс-аминирова","d":"Восстановительное аминирование заключается в восстановлении смеси карбонильного соединения с аммиаком (или амином). Процесс протекает по схеме присоединения-отщепления с образованием имина, который затем восстанавливается в амин. Восстановительное аминирование осуществляется в организме в ходе синтеза α-аминокислот. В организме осуществляется такой же процесс, только в качестве оксосоединений используются кетонокислоты, а восстанавливающим агентом является кофермент НАДН. В результате этой реакции образуется только один стереоизомер L-ряда, что обусловлено стереоспецифическим строением фермента, катализирующим эту реакцию. Например: α-кетоглу","sec":"bioc"},{"t":"Объясните действие и биологическую роль окислительно-восстановительной системы хинон-гидрохинон","d":"Окислительно-восстановительные свойства системы хинон-гидрохинон играют важную роль в организме. По отношению к большинству органических субстратов выполняет роль окислителя. Принимая электроны от субстрата, замещённый хинон in vivo превращается в соответствующий гидрохинон, который, в свою очередь передавая электроны (через цитохромную систему) кислороду, обратно восстанавливается в хинон. Таким образом, система хинон-гидрохинон участвует в процессе переноса электронов от субстрата к кислороду. В частности, этот процесс происходит во время дыхания.","sec":"bioc"},{"t":"Конфигурация. Стереоизомерия молекул с одним центром хиральности. Проекционные формулы Фишера. D,L-система стереохимической номенк","d":"Конфигурация молекул в стереохимии характеризует пространственное расположение атомов или групп атомов у асимметрического атома, у несимметрично замещенной двойной связи, у малого (жёсткого) цикла, у центрального атома в комплексах. Различия между конфигурациями молекул обусловливают существование двух видов устойчивых стереоизомеров — геометрических и оптических. Конфигурация молекулы не меняется при изменении её конформации, т.е. при повороте вокруг простых связей отдельных частей молекулы относительно друг друга.","sec":"bioc"},{"t":"Проекционные формулы Фишера. Молекулы с одним центром хиральности могут существовать в виде двух энантиомеров (D- и L-формы, являю","d":"Для углеводов, α-гидроксикислот, α-аминокислот широко используют также D,L-систему, основанную на сравнении конфигурации рассматриваемого асимметрического центра с конфигурацией соответствующего энантиомера глицеринового альдегида. При рассмотрении проекционных формул Фишера расположение групп ОН или NH2 слева обозначается символом L (от лат. laevus – левый), справа – символом D (от лат. dexter – правый).","sec":"bioc"},{"t":"Стереоизомерия молекул. Молекулы с двумя и более центрами хиральности имеют число стереоизомеров, высчитываемое по формуле N=2n, г","d":"4.Энантиомеры – стереоизомеры, являющиеся зеркальным отражением друг друга, главным условием наличия которых является наличие как минимум одного центра хиральности в молекуле. Могут вырождаться в мезоформу (см. выше). В отличие от энантиомеров, σ-диастереомеры не являются зеркальным отражением друг друга. Рацемат — эквимолярная смесь двух энантиомеров. Рацематы не обладают оптической активностью, а также отличаются по свойствам от индивидуальных энантиомеров.","sec":"bioc"},{"t":"Химические свойства α-аминокислот (образование внутрикомплексных солей, реакции этерификации, ацилирования, образования иминов, ги","d":"Аминокислоты как амфотерные соединения образуют соли как с кислотами (по группе NH2), так и со щелочами (по группе СООН): С ионами тяжелых металлов α-аминокислоты образуют внутрикомплексные соли . Комплексы меди (II), имеющие глубокую синюю окраску, используются для обнаружения α-аминокислот. Реакция этерификации (по группе СООН): Ацилирование (образование N-ацильных производных) происходит при взаимодействии аминокислот галогенангидридами или ангидридами. В результате получаются соединения, которые можно рассматривать либо как N-ацильные производные, либо как N-замещённые амиды.","sec":"bioc"},{"t":"Объясните механизм алкилирования этилбензола трет-бутанолом","d":"Следует учитывать, что в этой реакции идёт одновременное образование двух изомерных соединений с пара- и орто-положениями заместителей. Однако здесь я рассмотрю только преимущественный вариант, то есть с образованием пара-изомера, так как механизм образования орто-изомера отт рассматриваемого практически не отличается. H C(CH3)3 – OH + H+ → C(CH3)3 – O+– H → C+(CH3)3 + H2O Получившуюся в результате электрофильную частицу обозначу для удобства буквой Е+. Этильный радикал в этилбензоле для удобства опущен. Следует учитывать, что он подразумевается у атома углерода, противоположного тому, у которого происходят превращения.","sec":"bioc"},{"t":"Выясните возможность вступления 2-метилпропаналя и 2,2-диметилпропаналя в альдольную и кротоновую конденсацию. Приведите схему реа","d":"2,2-диметилпропаналя в реакции альдольной и кротоновой конденсации вступать не будет из-за отсутствия атома водорода у С-2, то есть невозможно провести его отщепление у С-2 с образованием аниона – промежуточного продукта реакции. Для 2-метилпропаналя реакция альдольной конденсации будет идти следующим образом (все реакции обратимы): CH3 CH3 CH3 – CH – COH + OH- → CH3 – C- – COH + H2O","sec":"bioc"},{"t":"Взаимное влияние атомов и способы его передачи в молекулах органических соединений. Сопряжённые системы с открытой цепью. Сопряжён","d":"Наличие в молекуле полярной σ-связи вызывает поляризацию ближайших σ-связей и ведёт к возникновению частичных зарядов на соседних атомах (обозначаются буквой δ с указанием знака: «+» или «-»). Таким образом, заместители вызывают поляризацию не только «своей», но и соседних σ-связей. Вид передачи электронного влияния заместителей за счёт смещения электронов σ-связей принято называть индуктивным эффектом (I-эффект). Из-за слабой поляризуемости σ-связи индуктивный эффект затухает через три-четыре связи в цепи. Направление индуктивного эффекта заместителя принято качественно оценивать путём сравнения с атомом водорода, индуктивный эффект которого","sec":"bioc"},{"t":"Декарбоксилирование α-аминокислот – путь к образованию биогенных аминов и биорегуляторов (коламин, гистамин, триптамин, серотонин,","d":"Процесс декарбоксилирования α-аминокислот ведёт к образованию биогенных аминов. Α-аминокислоты содержат в α-положении к карбоксильной группе электронакцепторную аминогруппу (точнее, протонированую аминогруппу NH3+), в связи с чем способны к декарбоксилированию. В лабораторных условиях эта реакция протекает при нагревании α-аминокислот в присутствии поглотителей диоксида углерода, например, гидроксида бария. В организме процесс проиходит с участием ферментов декарбоксилаз и кофермента пиридоксальфосфата (см. билет №4, вопрос 2). Эта реакция осуществляется за счёт разрава в альдимине I полярной связи между α-углеродным атомом и карбоксилатной г","sec":"bioc"},{"t":"Рассмотрите возможные пути превращения 3-хлорбутаналя в присутствии этоксида натрия. Приведите уравнения реакций, укажите механизм","d":"Первые две реакции идут по механизму мономолекулярного нуклеофильного замещения, третья – нуклеофильного присоединения. Продукты: гидрид натрия, этил-3-хлорбутират; хлорид натрия, 3-этоксибутаналь; 1-этокси-3-хлорбутират натрия.","sec":"bioc"},{"t":"Поляризация связей и электронные эффекты (индуктивный и мезомерный) как причина неравномерного распределения электронной плотности","d":"Поляризация химической связи — асимметрия (смещение) электронной плотности, связывающей молекулярной орбитали ковалентной связи. Если атомы, образующие ковалентную связь, одинаковы и несут одинаковые или близкие по электроотрицательности заместители, распределение электронной плоскости симметрично относительно плоскости, перпендикулярной связи и пересекающей связь на равных расстояниях от атомов; такие связи называют неполярными. В случае, когда атомы, образующие ковалентную связь различны или несут различные заместители, электронная плотность смещается в сторону более электроотрицательного атома; такие связи называются поляризованными (поляр","sec":"bioc"},{"t":"Пептиды. Строение пептидной группы. Гидролиз пептидов. Понятие об установлении аминокислотного состава и аминокислотной последоват","d":"Пептиды – природные или синтетические соединения, молекулы которых построены из остатков α-аминокислот, соединенных между собой пептидными (амидными) связями – C(O) – NH –. Могут содержать в молекуле также неаминокислотную компоненту (сложные белки). По числу аминокислотных остатков, входящих в молекулы пептидов, различают дипептиды, трипептиды, тетрапептиды и т.д. Пептиды, содержащие до 10 аминокислотных остатков, называются олигопептидами, содержащие более 10 аминокислотных остатков – полипептидами. Природные полипептиды с молекулярной массой более 6 тыс. а.е.м. называют белками.","sec":"bioc"},{"t":"Кислотность и основность органических соединений. Теории Бренстеда и Льюиса. Сопряжённые кислоты и основания. Кислотные свойства с","d":"Важными аспектами реакционной способности органических соединений является их кислотные и основные свойства. Для описания кислотных и основных свойств химических соединений существует несколько теорий – теория Бренстеда и Лоури, теория Льюиса и ряд других. Наиболее распространенной является теория Бренстеда и Лоури, или протолитическая теория. По теории Бренстеда – Лоури кислоты – это нейтральные молекулы или ионы, способные отдавать протон (доноры протона), а основания – это нейтральные молекулы или ионы, способные присоединять протон (акцепторы протона).","sec":"bioc"},{"t":"Моносахариды. Классификация, стереоизомерия, D- и L-стереохимические ряды. Формулы фишера и Хеуорса. Фуранозы и пиранозы, α- и β-а","d":"Классификация моносахаридов: альдозы (моносахариды содержащие альдегидную группу), кетозы (моносахариды содержащие кетогруппу) Моносахариды в зависимости от длины углеродной цепи (3-10 атомов) делятся на триозы, пентозы, гексозы, гептозы и т.д. Относительная конфигурация моносахаридов, т.е. принадлежность к D- или L-стереохимическому ряду, определяется путем сравнения конфигурации хирального атома углерода имеющего наибольший номер, с конфигурацией хирального центра в D- или L-глицериновом альдегиде","sec":"bioc"},{"t":"Какие продукты образуются при гидролизе амида масляной кислоты?","d":"Кислотный гидролиз необратим. Реакционная способность амидов в реакциях ацилированя низкая и NH2-плохоуходящая группа, поэтому для гидролиза необходим кислотный катализ.","sec":"bioc"},{"t":"Объясните прототропную таутомерию на примере имидазола и пурина","d":"Прототропная таутомерия – таутомерия, при которой мигрирующей группой является протон.","sec":"bioc"},{"t":"Реакции свободнорадикального замещения. Гомолитические реакции с участием sp3-гибридизированного атома углерода. Галогенирование,","d":"Углеводородам наиболее характерны следующие реакции: радикального замещения (SR, характерны для насыщенных углеводородов), электрофильного присоединения (AE, для ненасыщенных), электрофильного замещения (SE, для ароматических). Эти же реакции часто свойственны производным углеводородов, т.е. соединениям других классов, содержащих углеводородные фрагменты. В большинстве гетеролитичских реакций алканы инертны, т.к. для них характерны неполярные Сsp3 – Сsp3 и практически неполярные Сsp3 – H σ-связи, достаточно прочные и не склонные к гетеролитическому разрыву под действием электрофильных или нуклеофильных агентов (под гетеролитическим разрывом с","sec":"bioc"},{"t":"Реакции электрофильного присоединения. Механизм реакций гидрогалогенирования и гадратации. Кислотный катализ. Влияние статических","d":"Ненасыщенные углеводороды – алкены и циклоалкены – содержат двойные связи и проявляют способность к реакциям присоединения по этим связям. Благодаря электронам π-связи в молекулах алкенов имеется область повышенной электронной плотности, поэтому они склонны подвергаться атаке электрофильными реагентами. Присоединение воды к алкенам (гидратация) осуществляется только в присутствии катализатора, как правило, серной кислоты. Это известный способ получения спиртов.","sec":"bioc"},{"t":"Первой стадией синтеза эфедрина является ацилирование бензола хлорангидридом 2-хлорпропановой кислоты. Напишите схему реакции и ук","d":"Эта реакция протекает в присутствие AlCl3 по механизму электрофильного замещения. + HCl","sec":"bioc"},{"t":"Объясните антибактериальное действие препаратов на основе 8-гидроксихинолина","d":"В основе биологического действия соединений 8-гидроксихинолинового ряда лежит их способность к образованию прочных хелатных комплексов с ионами некоторых металлов. Таким образом, происходит «связывание» элементов, необходимых для жизнедеятельности бактерий.","sec":"bioc"},{"t":"Реакции электрофильного замещения в ароматических системах. Механизм реакций галогенирования и алкилирования (алкенами, спиртами)","d":"Ароматическим углеводородам бензольного ряда (аренов) свойственны реакции, не приводящие к нарушению ароматической системы, т.е. реакции замещения. Арены не склонны вступать в реакции присоединения или окисления, ведущие к нарушению ароматичности. По этой причине при окислении гомологов бензола и других ароматических соединений в жестких условиях (нагревание с перманганатом калия или дихроматом калия в кислой среде) окисляются только боковые углеводородные радикалы.","sec":"bioc"},{"t":"Олигосахариды. Дисахариды: амльтоза, целлобиоза, лактоза, сахароза. Строение, цикло-оксо (кольчато-цепная) – таутомерия. Восстанов","d":"Олигосахариды – углеводы, построенные из нескольких остатков моносахаридов (от 2 до 10), связанных между собой гликозидной связью. Простейшими олигосахаридами являются дисахариды (биозы), которые состоят из остатков двух моносахаридов и представляют собой гликозиды (полные ацетали), в которых один из остатков выполняет роль агликона. С ацетальной природой связана способность дисахаридов гидролизоваться в кислой среде с образованием моносахаридов.","sec":"bioc"},{"t":"Реакции нуклеофильного замещения у sp3 – гибридизированного атома углерода. Гетеролитические реакции, обусловленные поляризацией σ","d":"В галогенпроизводных, спиртах, тиолах и аминах алифатического ряда тетрагональный sp3-гибридизованный атом углерода связан одинарной σ-связью с гетероатомом функциональной группы. Гетероатом более электроотрицателен, чем углерод, и электроны σ-связи смещены в его сторону. Поэтому данные соединения являются субстратами в реакциях нуклеофильного замещения SN. Y- + Cδ+(Xδ-) C – Y + X- Нуклеофильное замещение может протекать по двум основным механизмам – бимолекулярному и мономолекулярному. При бимолекулярном механизме атакующая частица постепенно вытесняет уходящую группу. Образование новой и разрыв старой связи происходит одновременно (синхронн","sec":"bioc"},{"t":"Полисахариды. Крахмал (амилоза и амилопектин), гликоген, декстран, целлюлоза, полигалактуроновая кислота, хондроитинсульфаты. Пред","d":"Полисахариды составляют основную массу органической материи в биосфере Земли. Они выполняют три важные биологические функции, выступая в роли структурных компонентов клеток и тканей, энергетического резерва и защитных веществ. Полисахариды (гликаны) – высокомолекулярные углеводы. По химической природе они являются полигликозидами (полиацеталями). По принципу строения полисахариды не отличаются от восстанавливающих олигосахаридов. Каждое звено моносахарида связано гликозидными связями с предыдущим и последующим звеньями. При этом для связи с последующим звеном предоставляется полуацетальная гидроксильная группа, а с предыдущим – спиртовая груп","sec":"bioc"},{"t":"Приведите проекционные формулы конфигурационных стереоизомеров α-ацето-α-гидроксипропионовой кислоты","d":"COОH COОH H3C ОН НО CH3 C(O)CH3 C(O)CH3","sec":"bioc"},{"t":"Реакции элиминирования (дегидрогалогенирование, дегидратация). Повышенная СН-кислотность как причина реакций элиминирования, сопро","d":"Наличие слабого СН – кислотного цента в монофункциональных производных углеводородов типа , (где Х-галоген, ОН и т.д) предопределяет возможность его атаки основанием. Поскольку каждый нуклеофил в то же время является основанием в субстратах, содержащих β-водороные атомы, с реакцией нуклеофильного замещения конкурирует реакция отщепления (элиминирования). Дегидрогалогенирование алкилгалогенидов проводят по действием сильных оснований – концентрированного раствора гидроксида щелочного металла в спирте или алкоксида щелочного метала. Дегидратация спиртов проводится при нагревании их в сильнокислой среде, например в присутствии концентрированных ","sec":"bioc"},{"t":"Нуклеиновые кислоты. Пиримидиновые и пуриновые основания. Лактим-лактамная таутомерия. Реакции дезаминирования. Водородные связи в","d":"Нуклеиновые кислоты представляют собой высокомолекулярные соединения, молекулярная масса которых колеблется от 25 тыс. до 1 млн и более. Полимерные цепи нуклеиновых кислот построены из мономерных единиц – нуклеотидов, в связи с чем нуклеиновые кислоты называют полинуклеотидами. Обычно «неделимое» мономерное звено (например, аминокислотный остаток в белках) у нуклеотидов представляет собой трехкомпонентное образование, включающее гетероциклическое основание, углеводный остаток и фосфатную группу.","sec":"bioc"},{"t":"Приведите проекционные формулы стереизомеров этилового эфира β-гидроксимасляной кислоты. Имеются ли среди них диастереомеры?","d":"СН3COОC2H5 СН3COОC2H5 HO Н Н OH CH3 CH3 L-форма D-форма Среди стереоизомеров этой кислоты отсутствуют диастереомеры, так как в молекуле есть только один центр хиральности, и единственная пара стереоизомеров является энантиомерной парой.","sec":"bioc"},{"t":"Реакции нуклеофильного присоединения. Гетеролитические реакции с участием π-связи углерод-кислород (альдегиды, кетоны). Реакции ка","d":"Для альдегидов и кетонов наиболее характерны реакции нуклеофильного присоединения AN. Общее описание механизма нуклеофильного присоединения AN Легкость нуклеофильной атаки по атому углерода карбонильной группы альдегида или кетона зависит от величины частичного положительного заряда на атоме углерода, его пространственной доступности и кислотно-основных свойств среды. С учетом электронных эффектов групп, связанных с карбонильным атомом углерода, величина частичного положительного заряда δ+ на нем в альдегидах и кетонах убывает в следующем ряду:","sec":"bioc"},{"t":"Нуклеозиды. Гидролиз нуклеозидов. Нуклеотиды. Строение мононуклеотидов, образующих нуклеиновые кислоты. Гидролиз нуклеотидов. Рибо","d":"В химии нуклеиновых кислот входящие в их состав гетероциклические соединения пиримидинового и пуринового рядов обычно называют нуклеиновыми основаниями. Нуклеиновые основания в качестве заместителей в гетероцикле могут содержать: либо оксогруппу, как в урациле и тимине; либо аминогруппу, как в аденине; либо одновременно обе эти группы, как в цитозине и гуанине. Кислородсодержащие основания представлены лактамными таутомерными формами, в которых ароматичность не нарушена. Для всех оснований приняты сокращенные трехбуквенные обозначения, составленные из первых букв их латинских названий.","sec":"bioc"},{"t":"Приведите проекционную формулу стереоизомера природной α-аминомасляной кислоты, содержащей алифатический радикал, в форме биполярн","d":"Глутаминовая кислота: Природный стереоизомер (L-форма) D-форма COО – COО - H3N+ Н Н NH3+ (CH2)2CОO – (CH2)2CОO","sec":"bioc"},{"t":"Реакции нуклеофильного замещения у sp2-гибридизированного атома углерода (карбоновые кислоты и их функциональные производные). Реа","d":"Реакции нуклеофильного замещения характерны для карбоновых кислот и их функциональных производных. Они обусловлены способностью заместителя Х в соединениях типа R-CO-X уходить в виде аниона Х- или сопряженной кислоты НХ. Их результатом является замещение Х на другую нуклеофильную группу Y. Общая схема механизма таких реакций включает образование нестабильного продукта присоединения нуклеофила к атому углерода карбонильной группы.","sec":"bioc"},{"t":"Лекарственные средства на основе модифицированных нуклеиновых оснований (фторурацил, меркаптопурин). Нуклеозиды-антибиотики. Принц","d":"В качестве лекарственных средств в онкологии используют синтетические производные пиримидинового и пуринового рядов, по строению похожие на естественные метаболиты (в данном случае – на нуклеиновые основания), но не полностью им идентичные, т.е. являющиеся антиметаболитами. Например, 5-фторурацил выступает в роли антагониста урацила и тимина, 6-меркаптопурин – аденина. Конкурируя с метаболитами, они нарушают синтез нуклеиновых кислот в организме на разных этапах.","sec":"bioc"},{"t":"Как химическим путём различить растворы глюкозы и этилглюкозида?","d":"В молекуле глюкозы одна из гидроксильных групп существенно отличается по свойствам от всех остальных (см. реакцию ниже). Такая реакция не характерна для этилглюкозида, водород этой гидроксогруппы уже замещён на этильный радикал.","sec":"bioc"},{"t":"Реакции окисления и восстановления органических соединений. Реакции окисления спиртов, тиолов, карбонильных соединений, аминов. Ок","d":"Спирты (первичные и вторичные) по сравнению с углеводородами окисляются в значительно более мягких условиях. Альдегид, образующийся при этом из первичного спирта, легко окисляется далее в карбоновую кислоту. Особым случаем окисления является дегидрирование, когда субстрат теряет два атома водорода, что эквивалентно потере двух протонов и двух электронов (2Н+ и 2е-) или протона и гидрид-иона (Н и Н ). Тиолы при окислении образуют ряд продуктов последовательного окисления – сульфеновые, сульфиновые и сульфоновые кислоты. В этом состоит их отличие от спиртов, у которых окислению подвергается атом углерода.","sec":"bioc"},{"t":"Нуклеозидмоно- и полифосфаты. АМФ, АДФ, АТФ. Нуклеотиды. Никотинамиднуклеотидные коферментыю Строение НАД+ и его фосфата НАДФ+. Си","d":"Во всех тканях организма в свободном состоянии содержатся моно-, ди- и трифосфаты нуклеозидов. Особенно известны аденинсодержащие нуклеотиды – аденозин-5'-монофосфат (АМФ), аденозин-5'-дифосфат (АДФ) и аденозин-5'-трифосфат (АТФ). В ряде биохимических реакций участвуют такие нуклеотиды, как гуанозинтрифосфат (GTP), уридинтрифосфат (UTP), цитидинтрифосфат (CTP). Их дифосфатные формы обозначаются соответственно GDP, UDP, CDP.","sec":"bioc"},{"t":"Образование каких соединений возможно при нагревании этанольного раствора D-галактозы в присутствии HCl? Приведите уравнения реакц","d":"+ С2Н5ОН →(HCl)→ . C2H5 +H2O + C2H5OH → CH2–(CHOH)4 – CHOH OH OC2H5 полуацеталь →(HCl)→ CH2–(CHOH)4 – CHOС2Н5 OH OC2H5 Ацеталь","sec":"bioc"},{"t":"Многоатомные спирты (этиленгликоль, глицерин, инозит). Образование хелатных комплексов как качественная реакция на диольный фрагме","d":"Двухатомные спирты, т.е. спирты, содержащие две гидроксильные группы, имеют общее название диолы, или гликоли; трехатомные спирты называют триолами. Представителями таких спиртов являются этиленгликоль и глицерин соответственно. Общее название многоатомных спиртов – полиолы. В состав многих природных соединений входят в виде фрагментов двухатомные фенолы – пирокатехин, резорцин, гидрохинон. Этиленгликоль (этандиол-1,2) - высокотоксичная жидкость, используется в технике для приготовления антифризов – жидкостей с низкой температурой замерзания.","sec":"bioc"},{"t":"Омыляемые липиды: простые (воски, жиры и масла) и сложные (фосфолипиды, сфинголипиды, гликолипиды). Природные высшие жирные кислот","d":"Липиды составляют большую и достаточно разнородную по химическому составу группу входящих в состав живых клеток органических веществ, растворимых в малополярных органических растворителях (эфире, бензоле, хлороформе и др.) и нерастворимых в воде. В общем виде они рассматриваются как производные жирных кислот. Омыляемые липиды – это липиды, которые при щелочном гидролизе дают соли высших карбоновых кислот. Особенность строения липидов – присутствие в их молекулах одновременно полярных (гидрофильных) и неполярных (гидрофобных) структурных фрагментов, что придает липидам сродство как к воде, так и к неводной фазе. Липиды относятся к бифильным ве","sec":"bioc"},{"t":"Приведите пример реакции ацилирования пропантиола. Укажите механизм","d":"Реакция идёт по механизму нуклеофильного замещения.","sec":"bioc"},{"t":"Двухосновные карбоновые кислоты (щавелевая, малоновая, янтарная, глутаровая, фумаровая). Превращение янтарной кислоты в фурмановую","d":"Карбоновые кислоты, содержащие в своем составе одну карбоксильную группу, называют одноосновными, две – двухосновными и т.д. Далее мы рассмотрим некоторые двухосновные карбоновые кислоты, все они являются кристаллическими веществами. Систематические названия дикарбоновых кислот строятся по общим правилам заместительной номенклатуры. Однако для большинства из них предпочтительны тривиальные названия. Их латинские названия служат основой названия анионов и производных кислот, которые часто не совпадают с русскими тривиальными названиями.","sec":"bioc"},{"t":"Фосфолипиды. Фосфатидовые (фосфатидные) кислоты. Фосфатидилколамины и фосфатидилсерины (кефалины), фосфатидилхолины (лецитины) – с","d":"Согласно общей классификации липидов сложные липиды обычно делят на три большие группы: фосфолипиды, сфинголипиды и гликолипиды. В группу фосфолипидов входят вещества, отщепляющие при гидролизе фосфорную кислоту, например глицерофосфолипиды и некоторые сфинголипиды. В целом фосфолипидам свойственно достаточно высокое содержание ненасыщенных кислот. Глицерофосфолипиды являются главными липидными компонентами клеточных мембран. По химическому строению глицерофосфолипиды представляют собой производные L-глицеро-З-фосфата.","sec":"bioc"},{"t":"Осуществите превращения и назовите зашифрованные соединения","d":"CH3CH2CH3 →(Br2)→ A→(KOH)→ Б →[O]→ ацетон →(NH2OH)→ Г","sec":"bioc"},{"t":"Угольная кислота и её производные (уретаны, уреилы кислот, мочевина). Гуанидин. Карбамоилфосфат","d":"Угольная кислота занимает особое место среди соединений углерода, ее можно рассматривать как двухосновную кислоту. Угольная кислота как индивидуальное соединение существует только в водном растворе. Попытка выделить кислоту из раствора приводит к ее разложению на диоксид углерода и воду. Угольная кислота и ее производные выполняют важные функции в организме, некоторые из них применяются в качестве лекарственных средств.","sec":"bioc"},{"t":"Понятие о структурных компонентах финголипидов (сфингозин, церамиды, сфингомиелины) и гликопротеидов (цереброзиды, ганглиозиды)","d":"Церамиды – эо N-ацилированные производные спирта сфингозина. Церамиды в незначительных количествах присутствуют в тканях растений и животных. Гораздо чаще они входят в состав сложных липидов – сфингомиелинов, цереброзидов, ганглиозидов и др. Сфинголипиды представляют собой структурные аналоги глицерофосфолипидов, в которых вместо глицерина используется сфингозин. Другим примером сфинголипидов служат рассмотренные выше церамиды.","sec":"bioc"},{"t":"Приведите проекционную формулу Фишера для триптофана. Что такое изоэлектрическая точка аминокислот (ИЭТ)?","d":"COOH COOH H NH2 NH2 H CH2 CH2 D-форма L-форма Положение равновесия, т.е. соотношение различных форм аминокислоты, в водном растворе при определенных значениях рН существенно зависит от строения радикала, главным образом от присутствия в нем ионогенных групп, играющих роль дополнительных кислотных и основных центров.","sec":"bioc"},{"t":"Приведите уравнения реакций, объясняющие, каким образом ацетилсалициловая кислота (аспирин) выводится из организма в виде О-глюкур","d":"+ Н2О → + CH3COOH + → Первая предложенная реакция обратима. ( ) – гликозидный гидроксил Предложенный путь, по существу, не соответствует тому пути преобразований, который происходит в организме, поэтому на всякий случай привожу ниже схему преобразований ацетилсалициловой кислоты в организме.","sec":"bioc"},{"t":"Аминоспирты (коламин, холин, ацетилхолин). Аминофенолы (дофамин, норадреналин, адреналин). Понятие о биологической роли этих соеди","d":"Аминоспиртами называют соединения, содержащие в молекуле одновременно амино- и гидроксигруппы. Эти две функциональные группы непрочно удерживаются у одного атома углерода, в результате чего происходит отщепление аммиака или воды. Простейшим представителем аминоспиртов является 2-аминоэтанол – содинение, в котором обе группы расположены у соседних атомов углерода. 2-аминоэтанол (тривиальное название коламин) является структурным компонентом сложных липидов – фосфатидилэтаноламинов.","sec":"bioc"},{"t":"Неомыляемые липиды. Изопреноиды. Моно- и бициклические терпены (лимонен, ментол, камфора). Сопряжённые полиены (каротиноиды, витам","d":"Вместе с омыляемыми липидами в липидных фракциях, извлекаемых органическими растворителями из материала как животного, так и растительного происхождения, содержатся в небольшом количестве вещества, обладающие высокой биологической активностью. К ним относятся стероидные гормоны, простаноиды, некоторые коферменты, жирорастворимые витамины, объединяемые общим названием — низкомолекулярные биорегуляторы. За этими веществами закрепилось название «неомыляемые липиды», потому что они не гидролизуются в щелочной или кислой среде. К ним, например, относятся терпены и стероиды. Первые характерны для растений, вторые имеют животное происхождение. Между","sec":"bioc"},{"t":"Гидрокси- и аминокислоты. Реакции циклизации. Лактоны. Лактамы. Гидролиз лактонов, лактамов. Реакции элиминирования β-гидрокси- и","d":"Гидроксикислотами называют соединения, содержащие в молекуле одновременно гидроксильную и карбоксильную группы. Аминокислоты содержат в молекуле аминогруппу и карбоксильную группу. В алифатическом ряду по взаимному расположению функциональных групп различают α-, β-, γ- и т. д. гидрокси- и аминокислоты. Буквой греческого алфавита указывают положение другой функциональной группы относительно карбоксильной, при этом отсчет ведется от ближайшего к карбоксильной группе атома углерода, т.е. от атома С-2. Отметим, что в заместительной номенклатуре для замещенных карбоновых кислот локанты α-, β-, γ- и т. д. не употребляются.","sec":"bioc"},{"t":"Стероиды. Представление об их биологической роли. Гонан (стеран). Конформационное строение 5α- и 5β-стеранового скелета. Углеводор","d":"Стероиды широко распространены в природе и выполняют в организме человека разнообразные функции, в том числе являются биорегуляторами. Наряду с использованием природных стероидов синтетически получено множество физиологически активных веществ стероидной природы. В основе структуры стероидов лежит скелет гонана, состоящий из конденсированных, нелинейно сочлененных циклогексановых колец А, В и С и циклопентанового кольца D. Общая структура стероидов и принятый порядок нумерации атомов приведены ниже.","sec":"bioc"},{"t":"Объясните механизм образования этилена из этанола в присутствии катализатора – концентрированной H2SO4","d":"H CH3 – CH2 – OH →(H+)→ CH3 – CH2 – O+– H →(-H2O)→ CH3 – CH2+ → →(- H+)→ CH2 = CH2","sec":"bioc"},{"t":"Альдегидо- и кетонокислоты (глиоксиловая, пировиноградная, фосфоенилпируват, ацетоуксусная, щавелевоуксусная, α-оксоглутаровая). Р","d":"Оксокислотами называют соединения, содержащие в молекуле одновременно карбоксильную и альдегидную (или кетонную) группы. В соответствии с этим различают альдегидокислоты и кетонокислоты. Простейшей альдегидокислотой является глиоксалевая (глиоксиловая) кислота, которая обычно существует в виде гидрата (НО)2СНСООН. Она содержится в недозрелых фруктах, но по мере созревания ее количество уменьшается. Важную роль в биохимических процессах играют кетонокислоты – пировиноградная, ацетоуксусная и щавелевоуксусная.","sec":"bioc"},{"t":"Стероидные гормоны. Эстрогены (эстрон, эстрадиол), андрогены (андростерон, тестостерон), гестагены (прогестерон), кортикостероиды","d":"Кортикостероиды – группа стероидных гормонов, образующихся в корковом веществе надпочечников. Основу их структуры составляет углеводород прегнан. Боковая цепь в кортикостероидах у атома С-17 включает два атома углерода в виде группировки -CO-CH2OH. Кортикостероиды можно разделить на две группы: минералокортикостероиды, регулирующие водный и солевой обмены. Глюкокортикостероиды оказывают противовоспалительное, противошоковое, антиаллергическое действие. Их получают либо из коркового слоя надпочечников крупного рогатого скота, либо синтетически и используют при лечении бронхиальной астмы, экзем, инфекционного гепатита, артритов. Примерами служа","sec":"bioc"},{"t":"Систематическое название одной из желчных кислот - 3α,7α-дигидрокси-5β-холан-24-овая кислота. Приведите её структуру","d":"Для понимания принципов составления систематических наименований подобных соединений рекомендуется ознакомиться со вторым вопросом 21 билета.","sec":"bioc"},{"t":"Гетерофункциональные производные бензольного ряда как лекарственные средства. Салициловая кислота и её производные (ацетилсалицило","d":"П-аминобензойная кислота (ПАБК) и ее производные. Эфиры ароматических аминокислот способны в той или иной степени вызывать местную анестезию. Особенно заметно это свойство у пара-производных. В медицине используют анестезин (этиловый эфир ПАБК) и новокаин (2-диэтиламиноэтиловый эфир ПАБК). Новокаин применяют в виде соли (гидрохлорида), что связано с необходимостью повышения его растворимости в воде. Салициловая кислота относится к группе фенолокислот. Как соединение с орто-расположением функциональных групп она декарбоксилируется при нагревании с образованием фенола.","sec":"bioc"},{"t":"Жёлчные кислоты. Холевая кислота. Гликохолевая и таурохолевая кислоты","d":"Алифатическая боковая цепь у атома С-17 в желчных кислотах, производных углеводорода холана, состоит из 5 атомов углерода и включает концевую карбоксильную группу. Из желчи человека выделены четыре кислоты, которые получили название холевых кислот. Наиболее распространенная среди них – самахолевая кислота. Все гидроксильные группы в ней имеют α-расположение, а кольца А и В – цис-сочленение. Другие кислоты этой группы отличаются отсутствием одной или двух гидроксильных групп у атомов С-12 и С-17.","sec":"bioc"},{"t":"Назовите природные макроэргические ацилирующие реагенты. Приведите формулу ацетилфосфата","d":"К природным макроэргическим ацилирующим реагентам относятся: ацилфосфаты, ацилкоферментА","sec":"bioc"},{"t":"Биологически важные гетероциклические системы с одним гетероатомом. Пиррол, индол, пиридин, хинолин, никотинамид, пиридоксаль, про","d":"Гетероциклическими называют циклические органические соединения, в состав цикла которых, помимо атомов углерода, входят один или несколько атомов других элементов (гетероатомов). Ароматические гетероциклы – самые распространенные в природе, поэтому им уделено основное внимание в данной главе. Насыщенные гетероциклы, например приведенные ниже, представляют собой циклические простые эфиры или вторичные амины с циклическим скелетом.","sec":"bioc"},{"t":"Стерины. Холестерин. Эргостерин, превращение его в витамины группы Д","d":"Клетки живых организмов, как правило, очень богаты стеринами. В основе структуры стеринов лежит скелет углеводорода холестана, алифатический радикал R у атома С-17 которого включает 8 атомов углерода. В качестве обязательного заместителя стерины содержат гидроксильную группу у атома С-3, т. е. являются спиртами (поэтому в их названии часто присутствует суффикс -ол). Примерами служат холестерин, а также образующийся из холестерина в кишечнике и поэтому присутствующий в фекалиях копростанол. Гидроксильная группа у этих стеринов имеет β-ориентацию.","sec":"bioc"},{"t":"Биологически важные гетероциклические системы с несколькими гетероатомами. Пиразол, имидазол, тиазол, пиразин, пиримидин, пурин, д","d":"Пятичленные гетероциклы с двумя гетероатомами, один из которых азот, имеют общее название азолы. Важнейшими из них являются имидазол, пиразол и тиазол. Эти соединения, в отличие от пятичленных гетероциклов с одним гетероатомом, не разрушаются при действии кислот (т.е. неацидофобны), а образуют с ними соли. Имидазол. Этот гетероцикл является структурным фрагментом белковой аминокислоты гистидина и продукта ее декарбоксилирования - биогенного амина гистамина.","sec":"bioc"},{"t":"Агликоны сердечных гликозидов. Дигитоксигенин. Строфантидин","d":"Сердечные гликозиды – стероидные гликозиды растительного происхождения. В этих соединениях стероидная часть молекулы играет роль агликона (в этом случае его называют генином) в некоторых моноили олигосахаридах. В небольших количествах они возбуждают сердечную деятельность и используются в кардиологии, в больших дозах являются сердечными ядами. Эти соединения выделяют из различных видов наперстянки пурпуровой, ландыша, горицвета и других растений.","sec":"bioc"},{"t":"Покажите принадлежность лимонена (4-изопропенил-1-метилциклогексен) к изопреноидам","d":"L-лимонен Изопреноиды – соединения, построенные из фрагментов изопрена. один из самых распространённых изопреноидов.","sec":"bioc"}]},

проходит артерия, огибающая лопатку. на передней стенке подмышечной полости выделяют три треугольника","sec":"qa"},{"t":"ключично-грудной треугольник","d":"(trigonum clavipectorale), ограниченный сверху ключицей, снизу – верхним краем малой грудной мышцы;","sec":"qa"},{"t":"подгрудной треугольник","d":"СИНТОПИЯ Сосудисто-Нервных ПУЧКОВ Ниже и медиальнее всего располагается v. axillaris; над ней и кнаружи лежит a. axillaris, еще выше и далее кнаружи – plexus brachialis. Таким образом, a. axillaris в подключичной области расположена между плечевым сплетением и подкрыльцовой. веной. Указанные элементы лежат не в одной плоскости: поверхностнее всего залегает v. axillaris, глубже и над нею – артерия и еще глубже и выше – plexus…","sec":"qa"},{"t":"Топография лобно-теменно-затылочной области","d":"Внешние ориентиры лобно-теменно-затылочной области головы. Надглазничный край орбиты, затылочный бугор, козелок уха, наружный слуховой проход. Границы лобно-теменно-затылочной области головы Передняя граница — надглазничный край, margo supraorbitalis, задняя граница — наружный затылочный бугор, protuberantia occipitalis externa, и верхняя выйная линия, linea nuchae superior, идущая в горизонтальном направлении по сторонам от…","sec":"qa"},{"t":"Операции при бедренных грыжах","d":"Бедренный канал Бедренный канал в норме не существует. Он образуется при выходе бедренных грыж через бедренное кольцо, далее между листками широкой фасции бедра и через hiatus saphenus под кожу. Этот канал ведет из полости живота на переднюю поверхность бедра и имеет два отверстия и три стенки. Внутреннее отверстие бедренного канала (бедренное кольцо) ограничено","sec":"qa"},{"t":"сзади – гребенчатой связкой","d":"Глубокое кольцо бедренного канала находится в медиальной части сосудистой лакуны под паховой связкой и ограничено: - сверху – паховой связкой у места прикрепления ее к лобковому бугорку и симфизу; - снизу – лобковым гребнем и покрывающей его гребенчатой связкой; - медиально – лакунарной связкой, заполняющей внутренний угол сосудистой лакуны; - латерально – стенкой бедренной вены. Диаметр кольца не превышает 1 см, оно заполняется…","sec":"qa"},{"t":"Анатомия и топография тазобедренного сустава","d":"Границы: Верхняя — паховая (пупартова) связка (от tuberculum pubicum до spina iliaca anterior superior); нижняя — 4см выше основания надколенника; латеральная — линия от латерального надмыщелка бедра к spina iliaca anterior superior; медиальная — линия от медиального надмыщелка к нижнему краю symphisis pubica. Ориентиры: См. ГРАНИЦЫ, также бедренный треугольник, паховая складка К внутрисуставным связкам относится связка головки…","sec":"qa"},{"t":"Лапаротомия","d":"Все доступы к органам живота через переднюю брюшную стенку можно разделить на две группы: - общие (универсальные) доступы, позволяющие обнажать практически все органы живота; - специальные доступы для операции на одном органе или на группе близко расположенных друг к другу органов. По направлению разреза доступы как одной, так и другой группы подразделяют на четыре вида: продольные, поперечные, косые, угловые (комбинированные).…","sec":"qa"},{"t":"Операции на костях","d":"Остеотомия— это хирургическая операция, при которой производят искусственный перелом кости с целью устранить деформацию или улучшить функцию конечности. Виды остеотомии Остеотомия может быть: закрытой открытой. По форме рассечения кости применяют линейную (поперечную или косую) фигурную (угловую, ступенчатую, окончатую, желобковую) остеотомию. Сегментарную По цели операции все остеотомии условно делятся на корригирующие и…","sec":"qa"},{"t":"сзади – собственной фасцией голени","d":"Заднее ложе разделяется глубоким листком фасции голени на 2 отдела: поверхностный и глубокий. Поверхностный отдел содержит икроножную, камбаловидную и подошвенную мышцы. В глубоком отделе находятся m. flexor digitorum longus, m. flexor hallucis longus, m. tibialis posterior. Сосудисто-нервный пучок задней области голени (задние большеберцовые сосуды и большеберцовый нерв) проходит между глубоким и поверхностным слоями мышц голени…","sec":"qa"},{"t":"с латеральной стороны - m. flexor hallucis longus","d":"Канал имеет верхнее входное отверстие, два боковых ответвления (отверстия) и нижнее выходное отверстие. Входное отверстие представляет собой щель между arcus tendineus m. solei и m. popliteus. Через эту щель проходят подколенная артерия с одноименной веной и большеберцовый нерв. Сразу после вхождения в канал подколенная артерия разделяется на переднюю и заднюю большеберцовые артерии","sec":"qa"},{"t":"Второе ответвление – это отхождение в средней трети голени малоберцовой артерии, которая проходит в щель между m. flexor","d":"Нижнее выходное отверстие - это щель между поверхностным и глубоким слоями мышц задней области голени в нижней трети, через которую сосудисто-нервный пучок проникает в лодыжковый канал. Кверху клетчатка глубокого ложа голени сообщается с клетчаткой подколенной ямки, кпереди – с клетчаткой переднего межмышечного промежутка по ходу передней большеберцовой артерии, книзу – по ходу сухожилий глубоких сгибателей голени и клетчатки,…","sec":"qa"},{"t":"Операции при внематочной","d":"пункция Дугласова кармана, анатомическое обоснование; доступы к матке и ее придаткам; остановка кровотечения; перитонизация культи трубы; выход из операции). Пункция брюшной полости у женщин через задний свод влагалища Показания: уточнение диагноза абсцесса Дугласова пространства, эвакуация экссудата с последующим дренированием полости абсцесса. Противопоказания: облитерация влагалища, выраженная ретроверсия матки. Методика…","sec":"qa"},{"t":"Топографическая анатомия плечевого сустава","d":"Плечевой сустав образован головкой плечевой кости и суставной впадиной лопатки. Суставная капсула прикрепляется по краю впадины лопатки и по анатомической шейке плеча. Внешние ориентиры плечевого сустава это дельтовидная мышца. Практически всегда можно определить sulcus deltopectoralis и пальпировать задний край мышцы. можно пальпиро щ","d":"Ветви нижней брыжеечной артерии","sec":"qa"},{"t":"Верхняя прямокишечная артерия кровоснабжает нижнюю часть сигмовидной и верхнюю часть прямой кишки. Разветвление верхней ","d":"Венозное русло ободочной кишки формируется из вен, которые сопровождают одноименные артерии и их разветвления. Венозные сосуды сливаются, формируя истоки верхней и нижней брыжеечных вен. В области формирования верхней прямокишечной вены ее притоки соединяются с притоками средних прямокишечных вен, образуя внутристеночные портокавальные анастомозы. Лимфоотток Лимфоотток осуществляется в лимфоузлы, расположенные по ходу сосудов:…","sec":"qa"},{"t":"Анастомоз конец в конец – конец приводящего участка соединяют с концом отводящего","d":"Техника выполнения: - формирование задней стенки анастомоза – наложение непрерывного обвивного шва на внутренние губы анастомоза; - формирование передней стенки – наложение той же нитью непрерывного вворачивающего шва (Шмидена) на наружные губы анастомоза; - погружение вворачивающего и обвивного швов в просвет анастомоза узловыми серозно-мышечными швами Ламбера. Характеристика анастомоза - физиологичен – не нарушается естественный…","sec":"qa"},{"t":"Анастомоз бок в бок – соединяют боковые поверхности приводящего и отводящего участков кишки","d":"Техника выполнения: - ушивание проксимального и дистального концов тонкой кишки, формируя культи; S изоперистальтическое сопоставление приводящего и отводящего отделов кишки и их соединение на протяжении 6–8 см рядом узловых серозно-мышечных швов Ламбера; - вскрытие просвета кишок, не доходя 1 см до конца линии серозно- мышечных швов; - сближение внутренних краев (губ) образовавшегося просвета и наложение на них обвивного…","sec":"qa"},{"t":"Анастомоз конец в бок – конец приводящего участка соединяют с боковой поверхностью отводящего","d":"Техника выполнения: - соединение отдельными серозно-мышечными швами Ламбера стенки тонкой кишки со стенкой толстой кишки, ближе к брыжеечному краю; - продольное вскрытие просвета толстой кишки; - наложение непрерывного обвивного шва на внутренние губы анастомоза; - наложение той же нитью непрерывного вворачивающего шва (Шмидена) на наружные губы анастомоза; S наложение серозно-мышечных швов Ламбера на наружную стенку анастомоза…","sec":"qa"}]},
  {id:"patfiz",course:3,icon:"dna",name:"Патофизиология",desc:"Лечебное дело, 3 курс. Карточки вопрос-ответ по экзамену",c:"210,160,220",cd:"140,60,150",tests:[],cards:[{"t":"Охарактеризуйте патологическую физиологию как фундаментальную и интегративную науку и учебную дисциплину. Предмет и зада","d":"Патофизиология – наука, которая изучает общие закономерности возникновения, развития и исхода заболеваний. Это наука о жизнедеятельности больного организма. Она является теоретической базой системы подготовки врача, формирования основ, его клинического мышления и профессиональных действий. Задачи патофизиологии: 1)изучение проблем общей патологии – общая нозология 2) изучение причин болезни и создание общего учения о причинности в…","sec":"qa"},{"t":"Опишите методы патофизиологии. Моделирование как основной и специфический метод патофизиологии: его виды, возможности и ","d":"Основной метод исследования – эксперимент. Виды эксперимента: острый (оперативное вмешательство в организм животного – позволяет изучать острые расстройства – шок, коллапс, острая недостаточность дыхания, почек) и хронический (используют для моделирования хронических заболеваний – сахарный диабет, атеросклероз). Этапы патофизиологического эксперимента: - Планирование эксперимента (1. создание рабочей гипотезы, 2. постановка цели и…","sec":"qa"},{"t":"Получение информации об изменениях в организме экспериментального животного","d":"морфологические – макро- и микроскопическое исследование, -функциональные – электрокардиография, энцефалография, запись спирограммы, -биохимические -иммунологические","sec":"qa"},{"t":"Анализ и синтез полученных результатов","d":"математический, -сравнительный метод анализа – филогенетический (моделирование и сравнение патологических процессов у животных разного вида эволюционного развития), онтогенетический (изучение и сравнение патологических процессов у животных на разных этапах их индивидуального развития), топографо-анатомический (сравнение патологических процессов в разных органах). Главным методом патофизиологии является метод моделирования.…","sec":"qa"},{"t":"Раскройте основные понятия общей патофизиологии: норма, здоровье, переходные состояния организма между здоровьем и болез","d":"Норма – это оптимальное, состояние жизнедеятельности организма в данной конкретной для человека среде. Здоровье — это состояние полного физического, психического и социального благополучия человека, а не только отсутствие болезни или физических дефектов. Предболезнь — это период в жизнедеятельности организма, возникший под действием ряда патогенных факторов, характеризующийся снижением его адаптационных возможностей при сохранении…","sec":"qa"},{"t":"Охарактеризуйте понятие болезнь, ее стадии, классификации. Опишите роль этиологии в возникновении заболеваний. Охарактер","d":"Болезнь — это сложная общая реакция организма на повреждающее действие факторов внешней среды, это качественно новый жизненный процесс, сопровождающийся структурными, метаболическими и функциональными изменениями разрушительного и приспособительного характера в органах и тканях, приводящими к снижению приспособляемости организма к непрерывно меняющимся условиям внешней среды и ограничению трудоспособности. В развитии болезни можно…","sec":"qa"},{"t":"Назовите основные группы факторов внешней среды, оказывающих влияние на организм. Болезнетворное действие звука и шума н","d":"1 - Действие звука и шума. 2 – Механическая травма. 3 – Действие высоких и низких температур. 4 – Барометрическое давление. 5 – Действие лучей солнечного спектра. 6 – Лазеры. 7 – Электрический ток. 8 Действие факторов космического полёта. Шум – неприятный или нежелательный звук, или совокупность звуков, нарушающих тишину, оказывающих раздражающее влияние на организм человека и снижающих его работоспособность. Болезнетворное…","sec":"qa"},{"t":"Этиология болезнетворного действия высокого барометрического давления на организм: патогенез кессонной болезни; проявлен","d":"Гипербарии подвергаются при погружен ы – пороки развития у детей, заболевания органов пищеварительной системы, инфекционные процессы, анорексия (патологическое отсутствие аппетита). По клиническим проявлениям полное голодание можно разделить на четыре периода: безразличия; возбуждения; нарастающего по мере усиления чувства голода; угнетения (самый длительный). Первый период голодания характеризуется усиленным…","sec":"qa"},{"t":"Неполное (недостаточное количество принимаемой пищи, в том числе белка)","d":"Дыхательный коэффициент снижается незначительно. Кровь становится гидремичной, нередко появляется анемия. Со стороны системы кровообращения отмечается брадикардия, снижение артериального давления. Ослабляется дыхание","sec":"qa"},{"t":"Частичное (недостаток в пище отдельных её компонентов - белков, липидов, углеводов, химических элементов, витаминов)","d":"При недостатке в пище углеводов основные нарушения связаны с усилением кетогенеза в печени, куда транспортируются жиры вследствие ее обеднения гликогеном.Недостаточное поступление в организм жиров в энергетическом отношении может быть восполнено углеводами и белками. При белковом голодании могут развиваться такие заболевания, как квашиоркор и алиментарная дистрофия. Квашиоркор - несбалансированная алиментарная…","sec":"qa"},{"t":"Дайте характеристику понятия и опишите этиологию воспаления. Приведите виды и механизмы альтерации как компонента воспал","d":"Воспаление - типовой патологический процесс, направленный на уничтожение, инактивацию или ликвидацию повреждающего агента и восстановление повреждённой ткани. Воспаление - местный процесс. Однако в его возникновении, развитии и исходах принимают участие практически все ткани, органы и системы организма. Этиология Воспаление - ответ организма на воздействие причины - флогогенного фактора, действующего в определенных условиях.…","sec":"qa"},{"t":"Природа флогогенного фактора может быть физической, химической или биологической","d":"♦ Физические факторы: механическая травма тканей, чрезмерно высокая или низкая температура, воздействие электрического тока или лучистой энергии. ♦ Химические факторы: органические и неорганические кислоты, щёлочи и соли; ЛС, вводимые в ткани. ♦ Биологические агенты: инфекционные (вирусы, риккетсии, бактерии, грибы); иммуноаллергические (комплексы Аг-АТ; денатурированные белки и погибшие участки ткани; инфицированные вирусом и…","sec":"qa"},{"t":"Выраженность воспалительного эффекта флогогенных агентов зависит не только от их природы и происхождения, но и от интенс","d":"Условия, влияющие на возникновение и течение воспаления • Реактивность организма. Воспаление может иметь нормергическое, гиперергическое и гипоергическое течение, в зависимости от реактивности организма и реактивных свойств ткани или органа в данный момент. • Регионарные особенности тканей важны для возникновения и характера развития воспаления. Так, хроническая локальная травма тканей, дистрофические процессы, нарушения…","sec":"qa"},{"t":"Охарактеризуйте изменение обмена веществ и физико-химических свойств в очаге воспаления. Охарактеризуйте основные клеточ","d":"Изменения обмена веществ Биологический смысл изменений обмена веществ заключается в энергетическом и пластическом обеспечении процессов, протекающих в очаге воспаления. На начальном этапе воспаления в тканях преобладают реакции катаболизма, а при активации процессов пролиферации начинают доминировать анаболические реакции. Изменения метаболизма в существенной мере регулируются медиаторами воспаления. В очаге воспаления, а нередко…","sec":"qa"},{"t":"Углеводы","d":"♦ Активируются гликогенолиз и гликолиз, обеспечивающие увеличение выработки макроэргических соединений. ♦ Под влиянием разобщителей окисления и фосфорилирования нарушается образование АТФ в цикле Кребса и энергия выделяется в виде тепла. ♦ Гликолиз в условиях гипоксии в очаге воспаления переходит на анаэробный путь, следствием чего является накопление избытка лактата и пирувата, которые формируют метаболический ацидоз. ♦…","sec":"qa"},{"t":"Липиды жение синтеза белков системы гемостаза (проконвертина, проакцелерина, фибриногена, протромбина, факторов Кристмаса и Стюарта-Прауэр, антикоагулянтных белков C и S), что приводит к гипокоагуляции белков крови, развитию…","sec":"qa"},{"t":"Приведите сведения о видах, этиологии, патогенезе печеночных ком","d":"Печеночная кома – клинический синдром, характеризующийся расстройством сознания и признаками печеночно-клеточной недостаточности, обусловленными массивным некрозом клеток печени. Различают 2 основных вида печеночной комы: •печеночно-клеточная (эндогенная); •портокавальная (шунтовая или экзогенная). В основе печеночно-клеточной комы, обусловленной массивным некрозом паренхимы печени, лежат чаще всего острый вирусный гепатит…","sec":"qa"},{"t":"Приведите виды и охарактеризуйте этиологические факторы нефропатий","d":"Нефропатия представляет собой нарушение работы почек вследствие поражения клубочкового аппарата и паренхимы почек различной этиологии. По происхождению причины нефропатий, в том числе различных заболеваний почек, делят на первичные и вторичные, наследственные и приобретенные внутриутробные и постнатальные. К первичным видам нефропатий относятся: - аномалии развития (агенезии, аплазии) почек: аномалии количественные (отсутствие…","sec":"qa"},{"t":"Охарактеризуйте общие механизмы расстройств фильтрационной функции почек","d":"Нарушение клубочковой фильтрации — уменьшении или увеличении ее величины независимо от объема поступившей в организм жидкости. Механизмы уменьшения объема клубочковой фильтрации 1.Снижение гидростатического давления на стенку капилляров клубочков вследствие склероза или спазма приносящих артериол почек; гипотензии в связи с сердечной или сосудистой недостаточностью, кровопотерей, обезвоживанием. 2.Повышение онкотического давления…","sec":"qa"},{"t":"Охарактеризуйте общие механизмы расстройств функций реабсорбции, секреции и экскреции в почках","d":"По этиологии нарушения могут быть наследственные и приобретенные; в зависимости от локализации дефекта — проксимальные и дистальные. Механизмы тубулопатий: отсутствие или качественные изменения белков-переносчиков, ферментов, рецепторов для гормонов или дистрофические процессы в стенке канальцев. Проксимальные тубулопатии Нарушения реабсорбции фосфатов (фосфатурия) Механизм: отсутствие транспортного белка для фосфатов и недостаток…","sec":"qa"},{"t":"Опишите этиологию и патогенез изменений суточного диуреза, состава мочи и ритма мочеиспускания, их диагностическое значе","d":"Изменение объема выделяемой мочи (диуреза) 1.Полиурия – увеличение суточного диуреза выше 1,5- 2 л в сутки независимо от объема выпитой жидкости. Причины полиурии: внепочечные (психогенная полидипсия, нарушения водно-солевого обмена и его регуляции – несахарный диабет), почечные (полиурическая стадия острой и хр. почечной недостаточности). 2.Олиго - и анурия - выделение в течение суток менее 500 – 300 мл мочи. Анурия - менее 200…","sec":"qa"},{"t":"Приведите виды, причины, диагностическое значение изменения показателей объема и состава крови при заболеваниях почек","d":"гиперволемия - вследствие снижения фильтрации плазмы крови в клубочках или увеличения реабсорбции воды в почечных канальцах; гиповолемия - результат увеличения фильтрации в клубочках или уменьшения реабсорбции воды в канальцах; гиперазотемия – повышение содержания в сыворотке крови креатинина, мочевины, мочевой кислоты и других метаболитов белкового и пуринового обменов; гипопротеинемия - из-за выраженной потери белка с мочой;…","sec":"qa"},{"t":"Охарактеризуйте этиологию, патогенез, клинические проявления пиелонефритов","d":"Пиелонефриты — группа синдромов (болезней), вызываемых микробами и характеризующихся развитием воспалительного процесса в почечных лоханках и интерстиции почки. Этиология и патогенез. Заболевание возникает в связи с занесением возбудителя инфекции в почки гематогенным путем или распространением его в восходящем направлении по мочевым путям. Возбудителями чаще всего являются кишечная палочка, кокки. Возникновению заболевания,…","sec":"qa"},{"t":"Приведите классификацию и охарактеризуйте этиологию, патогенез и проявления острых гломерулонефритов и хронических гломе","d":"Классификация. Гломерулонефрит может протекать остро или хронически. Выделяют два основных варианта течения острого процесса: - Типичный (циклический). Характерно бурное начало и значительная выраженность клинических симптомов; - Латентный (ациклический). Стертая форма, характеризующаяся постепенным началом и слабой выраженностью симптомов. Представляет опасность вследствие позднего диагностирования и тенденции к переходу в…","sec":"qa"},{"t":"Охарактеризуйте формы, этиологию, патогенез, проявления и последствия острой почечной недостаточности и хронической поче","d":"Острая почечная недостаточность (ОПН) – характеризуется остро возникающим нарушением гомеостаза из-за значительного и быстрого снижения скорости клубочковой фильтрации). Различают три формы ОПН: 1. преренальную - характеризуется нарушением почечной гемодинамики без повреждения паренхимы почек; 2. ренальную - связана с повреждением аппарата почечных канальцев; 3. постренальную - обусловлена остро возникающей окклюзией мочевыводящих…","sec":"qa"},{"t":"Стадии и механизмы развития стресса. Стресс – лимитирующие системы, их роль в адаптационных реакциях","d":"В развитии общего адаптационного синдрома выделяют три стадии: раннюю стадию, или реакцию тревоги, стадию резистентности и стадию истощения. 1) Реакция тревоги - характеризуется уменьшением размеров тимуса, селезенки, лимфатических узлов. Она длится от 6 до 48 ч после действия стрессора. Устойчивость организма к повреждающему фактору на стадии тревоги временно снижается. “Шок” и “Противоток” Во время «шока» снижается АД,…","sec":"qa"},{"t":"Опиатная система","d":"Под действием стресс-фактора из проопиломеланокортина продуцируется β-эндорфин. Стимуляция симпатической нервной системы при стрессорных воздействиях ведет к усиленной продукции β-энкефалина мозговым слоем надпочечников. Опиоидные пептиды способствуют повышению порога болевой чувствительности, что приводит к притуплению чувства боли, а порой и полной аналгезии. Снижение активности симпатической нервной системы опиатами связывают с…","sec":"qa"},{"t":"Серотонинергическая система головного мозга","d":"Под влиянием стресса усиливается обмен серотонина в головном мозге - в гипоталамусе и областях, тесно связанных с лимбической системой. Серотонин ограничивает возбуждение адренергических центров и, тем самым, лимитирует стресс-реакцию. Повышение концентрации серотонина в головном мозге предупреждает развитие сердечных аритмий (при острой ишемии миокарда) и фибрилляции сердца. 3) ГАМКергическая (тормозная) система в полушариях…","sec":"qa"},{"t":"Простагландиновая система","d":"Под влиянием стрессорного воздействия увеличивается активность фосфолипаз и как следствие - образование арахидоновой кислоты. Одновременная активация простагландин-синтетазы приводит к увеличению образования и выделения простагландинов","sec":"qa"},{"t":"Антиоксидантная система","d":"Антиоксидантный статус организма, а точнее активация антиоксидантных систем, не только предупреждает стрессорные повреждения, но и обеспечивает более совершенную адаптацию к экстремальным ситуациям","sec":"qa"},{"t":"Белки теплового шока (БТШ)","d":"Одним из факторов внутриклеточной адаптации, устойчивости к стрессорным воздействиям являются белки теплового шока (БТШ). Повышенный синтез БТШ является необходимым условием реакции организма на стресс и служит защитным фактором, помогающим клетке выжить. БТШ начинают активно экспрессироваться при разнообразных стрессорных воздействиях на организм (гипоксия, ишемия, воспаление, бактериальная или вирусная инфекция, химические…","sec":"qa"}]},
  {id:"prop",course:3,icon:"pulse",name:"Пропедевтика",desc:"Лечебное дело, 3 курс. Карточки вопрос-ответ по экзамену",c:"150,190,230",cd:"40,90,170",tests:[],cards:[{"t":"Нарушение сознания - виды","d":"Нарушение сознания является проявлением дисфункции полушарий, верхних отделов ствола головного [мозга], или и той и другой области одновременно. Так локальное поражение супратенториальных структур может носить распространенный характер, а может, вызывая [отек], смещать мозговые структуры, приводя к транстенториальной герниации, сдавлению диэнцефальных отделов головного мозга и нарушению функции диэнцефальной активирующей системы.…","sec":"qa"},{"t":"Общий осмотр больного. Положение тела больного. Состояние сознания","d":"Общий осмотр – оценка общего состояния больного, его сознания, положения, телосложения, изменения температуры тела, определение характерных для некоторых заболеваний особенностей выражения лица, а также оценка состояния кожи, ногтей, волосяного покрова, видимых слизистых, подкожной жировой клетчатки, лимфатических узлов, мышц, костей и суставов Сознание. Сознание может быть ясным и спутанным. Различают следующие виды нарушения…","sec":"qa"},{"t":"Общий осмотр больного. Телосложение, типы конституций, диагностическое значение","d":"Общий осмотр – оценка общего состояния больного, его сознания, положения, телосложения, изменения температуры тела, определение характерных для некоторых заболеваний особенностей выражения лица, а также оценка состояния кожи, ногтей, волосяного покрова, видимых слизистых, подкожной жировой клетчатки, лимфатических узлов, мышц, костей и суставов Телосложение больного. 1. Нормостенический – правильное телосложение, пропорциональное…","sec":"qa"},{"t":"Общий осмотр больного. Исследование подкожно-жировой клетчатки; отеки","d":"Подкожно-жировая клетчатка При осмотре подкожно-жировой клетчатки обращают влияние на степень ее развития, места наибольшего отложения жира, наличия отеков. Различают первичное (экзогенно-конституциональное ожирение, или алиментарно-обменное ожирение и вторичное (или нейроэндокринное ожирение). Ожирение может быть равномерным; преобладать в области живота (мужской тип); в области таза бедер (женский тип); в области шеи, плеч,…","sec":"qa"},{"t":"Общий осмотр больного. Исследование кожных покровов, костно-мышечной системы","d":"Осмотр кожи Окраска кожи: - бледная, оттенки: желтушная, зеленоватая, землистая, коричневатая, кофе с молоком»; - гиперемированная; - цианоз – центральный и периферический, ограниченный, местный; - желтуха (с зеленоватым оттенком, с коричневатым, с красноватым); - бронзовое (коричневое) окрашивание кожи. Как диффузное, так и пятнистое; - витилиго участки депигментации; - темно-бурая с усилением пигментации в естественных складках…","sec":"qa"},{"t":"Общий осмотр больного. Суставы, позвоночник","d":"Осмотр суставов При осмотре суставов определяют их конфигурацию, припухлость, болезненность при ощупывании и движениях, объем активных и пассивных движений. Кроме того исследуют кожу и подкожную клетчатку в области суставов. Конфигурация суставов может изменяться вследствие воспалительного процесса, тогда наблюдается увеличение сустава в объеме сглаживания его контуров, гиперемия. Может наблюдаться деформация суставов – стойкое…","sec":"qa"},{"t":"Общий осмотр больного. Выражение лица при различных заболеваниях","d":"Общий осмотр – оценка общего состояния больного, его сознания, положения, телосложения, изменения температуры тела, определение характерных для некоторых заболеваний особенностей выражения лица, а также оценка состояния кожи, ногтей, волосяного покрова, видимых слизистых, подкожной жировой клетчатки, лимфатических узлов, мышц, костей и суставов Осмотр лица. Лицо больного отражает состояние больного, а иногда позволяет поставить…","sec":"qa"},{"t":"Лихорадка, виды. Термометрия","d":"Температура — это физическая величина, характеризующая состояние термодинамического равновесия системы. Если система не находится в равновесии, то между её
