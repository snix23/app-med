<!DOCTYPE html>
<html lang="ru" data-skin="emerald">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Медкарты</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&display=swap" rel="stylesheet">
<style>
:root,[data-skin="emerald"]{
  --base:#0b1510;--o1:rgba(128,178,118,.42);--o2:rgba(46,110,76,.55);--o3:rgba(170,210,150,.2);--netC:#b9d8a8;--netOp:.16;--ecg:#b9e3a0;
  --glass:rgba(255,255,255,.065);--glass2:rgba(255,255,255,.11);--stroke:rgba(255,255,255,.11);--solid:#18271f;
  --text:#eef4ec;--text2:rgba(238,244,236,.64);--text3:rgba(238,244,236,.36);
  --accent:#cfe3bb;--ink:#17251b;--grad:linear-gradient(180deg,#e3efd4 0%,#b3cf9d 100%);--bi:rgba(23,37,27,.14);
  --ok:#93dd8e;--okS:rgba(147,221,142,.15);--bad:#ff907f;--badS:rgba(255,144,127,.14);--track:rgba(255,255,255,.1);
  --shadow:0 12px 32px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.07);color-scheme:dark;
}
[data-skin="clinic"]{
  --base:#060d1c;--o1:rgba(47,107,255,.55);--o2:rgba(34,180,220,.38);--o3:rgba(118,92,255,.34);--netC:#8fb6ff;--netOp:.2;--ecg:#6fd6ff;
  --glass:rgba(255,255,255,.075);--glass2:rgba(255,255,255,.13);--stroke:rgba(170,200,255,.17);--solid:#101b31;
  --text:#eef3ff;--text2:rgba(225,234,255,.68);--text3:rgba(225,234,255,.38);
  --accent:#8fd8ff;--ink:#06101f;--grad:linear-gradient(180deg,#ffffff 0%,#dbe8ff 100%);--bi:#0b1630;
  --ok:#5ee0a0;--okS:rgba(94,224,160,.15);--bad:#ff7a8a;--badS:rgba(255,122,138,.14);--track:rgba(255,255,255,.1);
  --shadow:0 14px 36px rgba(0,5,20,.45),inset 0 1px 0 rgba(255,255,255,.09);color-scheme:dark;
}
[data-skin="graphite"]{
  --base:#0e0f10;--o1:rgba(229,239,75,.16);--o2:rgba(120,120,128,.32);--o3:rgba(255,255,255,.08);--netC:#e5ef4b;--netOp:.1;--ecg:#e5ef4b;
  --glass:rgba(255,255,255,.06);--glass2:rgba(255,255,255,.1);--stroke:rgba(255,255,255,.1);--solid:#1b1c1e;
  --text:#f4f4f2;--text2:rgba(244,244,242,.62);--text3:rgba(244,244,242,.34);
  --accent:#e5ef4b;--ink:#141414;--grad:linear-gradient(180deg,#eef57a 0%,#d9e633 100%);--bi:#141414;
  --ok:#93dd8e;--okS:rgba(147,221,142,.14);--bad:#ff907f;--badS:rgba(255,144,127,.14);--track:rgba(255,255,255,.1);
  --shadow:0 12px 32px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.06);color-scheme:dark;
}
[data-skin="mist"]{
  --base:#e6ebe4;--o1:rgba(160,196,150,.7);--o2:rgba(255,255,255,.95);--o3:rgba(140,180,140,.45);--netC:#3d6a48;--netOp:.1;--ecg:#3d6a48;
  --glass:rgba(255,255,255,.55);--glass2:rgba(255,255,255,.82);--stroke:rgba(255,255,255,.88);--solid:#f8fbf6;
  --text:#16221a;--text2:rgba(22,34,26,.62);--text3:rgba(22,34,26,.36);
  --accent:#3d6a48;--ink:#ffffff;--grad:linear-gradient(180deg,#5f8f68 0%,#3d6a48 100%);--bi:rgba(255,255,255,.25);
  --ok:#2e9a4d;--okS:rgba(46,154,77,.13);--bad:#d44a3c;--badS:rgba(212,74,60,.11);--track:rgba(22,34,26,.1);
  --shadow:0 10px 30px rgba(40,70,45,.12),inset 0 1px 0 rgba(255,255,255,.7);color-scheme:light;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%}
body{background:var(--base);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden;font-size:16px;line-height:1.4;transition:background .5s}
button,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none;text-align:inherit}
a{color:inherit}
button:focus-visible,input:focus-visible,[role="button"]:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.display{font-family:"Fraunces",Georgia,"Times New Roman",serif;font-weight:500;letter-spacing:-.02em}

/* living background */
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;background:var(--base)}
.orb{position:absolute;border-radius:50%;will-change:transform}
.o1{width:80vmax;height:80vmax;top:-38vmax;right:-34vmax;background:radial-gradient(circle,var(--o1),transparent 62%);animation:d1 34s ease-in-out infinite alternate}
.o2{width:70vmax;height:70vmax;top:22%;left:-38vmax;background:radial-gradient(circle,var(--o2),transparent 62%);animation:d2 42s ease-in-out infinite alternate}
.o3{width:75vmax;height:75vmax;bottom:-40vmax;right:-26vmax;background:radial-gradient(circle,var(--o3),transparent 62%);animation:d3 48s ease-in-out infinite alternate}
@keyframes d1{to{transform:translate(-14vmax,12vmax) scale(1.1)}}
@keyframes d2{to{transform:translate(16vmax,-10vmax) scale(.94)}}
@keyframes d3{to{transform:translate(-12vmax,-14vmax) scale(1.08)}}
.net{position:absolute;inset:0;width:100%;height:100%;color:var(--netC);opacity:var(--netOp);-webkit-mask-image:radial-gradient(120% 60% at 85% 0%,#000 5%,transparent 62%);mask-image:radial-gradient(120% 60% at 85% 0%,#000 5%,transparent 62%)}
.ecg{position:absolute;left:0;bottom:18%;width:100%;height:90px;color:var(--ecg);opacity:.32;-webkit-mask-image:linear-gradient(90deg,transparent,#000 18%,#000 82%,transparent);mask-image:linear-gradient(90deg,transparent,#000 18%,#000 82%,transparent)}
.ecg .eb{fill:none;stroke:currentColor;stroke-width:1.2;opacity:.35}
.ecg .et{fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:240 1800;animation:trace 6.5s linear infinite}
@keyframes trace{from{stroke-dashoffset:2040}to{stroke-dashoffset:0}}
.grain{position:absolute;inset:0;opacity:.06;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}

#app{position:relative;z-index:1;height:100%;max-width:520px;margin:0 auto}
#view{height:100%;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:0 20px 130px;scrollbar-width:none}
#view::-webkit-scrollbar{display:none}
#view.full{padding-bottom:28px}
#view.anim>*{animation:rise .42s cubic-bezier(.2,.8,.2,1) both}
#view.anim>*:nth-child(2){animation-delay:.04s}
#view.anim>*:nth-child(3){animation-delay:.08s}
#view.anim>*:nth-child(4){animation-delay:.12s}
#view.anim>*:nth-child(n+5){animation-delay:.16s}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

.glass{background:var(--glass);border:1px solid var(--stroke);-webkit-backdrop-filter:blur(22px) saturate(140%);backdrop-filter:blur(22px) saturate(140%);border-radius:24px;box-shadow:var(--shadow)}
.grow{flex:1;min-width:0}
.t1{display:block;font-size:17px;font-weight:600;letter-spacing:-.01em;overflow-wrap:anywhere;line-height:1.3}
.t2{display:block;font-size:14px;color:var(--text2);margin-top:3px;overflow-wrap:anywhere;line-height:1.4}
.lead{color:var(--text2);margin-top:8px;font-size:15px;line-height:1.5}
.chev{color:var(--text3);flex:none;display:grid}
.bub{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;flex:none;background:rgba(var(--c),.18);color:rgb(var(--c))}
[data-skin="mist"] .bub{background:rgba(var(--cd),.13);color:rgb(var(--cd))}
.bub.lg{width:52px;height:52px;border-radius:16px}
.bub.xl{width:76px;height:76px;border-radius:24px}
.bub.n,[data-skin="mist"] .bub.n{background:var(--glass2);color:var(--accent)}

.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;height:56px;padding:0 22px;border-radius:99px;background:var(--grad);color:var(--ink);font-size:17px;font-weight:600;letter-spacing:-.01em;box-shadow:0 8px 24px rgba(0,0,0,.18),inset 0 1px 0 rgba(255,255,255,.4);transition:transform .14s,opacity .2s}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.45;pointer-events:none}
.btn.sm{height:46px;font-size:15px}
.btn.ghost{background:var(--glass);color:var(--text);border:1px solid var(--stroke);box-shadow:none;-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
.btn.split{justify-content:space-between;padding:0 10px 0 26px}
.btn .bi{width:38px;height:38px;border-radius:50%;background:var(--bi);color:var(--ink);display:grid;place-items:center;flex:none;transition:transform .3s cubic-bezier(.2,.8,.2,1)}
[data-skin="clinic"] .btn .bi,[data-skin="graphite"] .btn .bi{color:#fff}
[data-skin="graphite"] .btn .bi{color:var(--accent)}
.btn.split:active .bi{transform:translateX(4px)}
.btns{display:flex;flex-direction:column;gap:10px;margin-top:24px}
.linkbtn{display:block;width:100%;text-align:center;padding:14px 12px 4px;color:var(--text2);font-size:15px}
.linkbtn:disabled{opacity:.55}
.icon-btn{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--glass);border:1px solid var(--stroke);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);flex:none;transition:transform .14s}
.icon-btn:active{transform:scale(.92)}
.page-h{padding:26px 2px 18px}
.page-h h1{font-size:34px;line-height:1.1}
.sec{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:28px 2px 12px}
.sec h3{font-size:18px;font-weight:600;letter-spacing:-.01em}
.sec .more{font-size:14px;color:var(--text2);flex:none}
.mini{display:block;height:4px;border-radius:99px;background:var(--track);overflow:hidden;margin-top:10px}
.mini i{display:block;height:100%;background:var(--accent);border-radius:99px}
.pbadge{display:inline-flex;align-items:center;gap:5px;padding:5px 11px;border-radius:99px;font-size:12px;font-weight:600;background:var(--glass2);color:var(--text2);margin-top:10px}
.pbadge.pro{background:var(--grad);color:var(--ink)}
.fine{font-size:12px;color:var(--text3);text-align:center;margin-top:14px;line-height:1.55}
.err{color:var(--bad);font-size:13px;margin:8px 8px 0;min-height:18px}
.lbl{font-size:13px;color:var(--text2);margin:22px 6px 8px}
.field{display:flex;align-items:center;gap:10px;height:54px;padding:0 20px;border-radius:99px;background:var(--glass);border:1px solid var(--stroke);color:var(--text2);transition:border-color .2s}
.field:focus-within{border-color:var(--accent)}
.field input{flex:1;min-width:0;background:none;border:none;outline:none;font-size:16px;color:var(--text)}
.field input::placeholder,.inp::placeholder,.search input::placeholder{color:var(--text3)}

/* auth */
.auth{min-height:100%;display:flex;flex-direction:column;padding:22px 0 18px}
.brand{display:flex;align-items:center;gap:10px;font-size:26px}
.bm{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--glass2);color:var(--accent);border:1px solid var(--stroke)}
.visual{flex:1;min-height:230px;display:grid;place-items:center;position:relative;padding:16px 0}
.visual::before{content:"";position:absolute;width:62%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,var(--o1),transparent 70%);filter:blur(10px)}
.cell{width:min(68vw,290px);aspect-ratio:1;position:relative;color:var(--accent)}
.cell svg{width:100%;height:100%;overflow:visible;display:block}
.spin{transform-origin:150px 150px;animation:spin 70s linear infinite}
.spin.r{animation-direction:reverse;animation-duration:90s}
.beat{transform-origin:150px 150px;animation:beat 1.6s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes beat{0%,100%{transform:scale(1)}14%{transform:scale(1.07)}28%{transform:scale(.98)}42%{transform:scale(1.04)}}
.sheet{padding:12px 22px 22px;border-radius:34px}
.grab{width:44px;height:5px;border-radius:99px;background:var(--text3);margin:0 auto 18px}
.sheet h1,.codew h1,.setup h1{font-size:30px;line-height:1.15}
.sheet .field{margin-top:20px}
.credit{text-align:center;font-size:12px;color:var(--text3);margin-top:16px}
.credit a{color:var(--text2);text-decoration:none;font-weight:600}
.codew{padding-top:18px}
.codew .mark{width:62px;height:62px;border-radius:20px;display:grid;place-items:center;background:var(--glass2);color:var(--accent);border:1px solid var(--stroke);margin-bottom:18px}
.otp{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:24px}
.otp input{height:58px;min-width:0;border-radius:16px;text-align:center;font-size:24px;font-family:"Fraunces",Georgia,serif;background:var(--glass);border:1px solid var(--stroke);color:var(--text);outline:none;transition:border-color .2s,transform .2s}
.otp input:focus{border-color:var(--accent);transform:translateY(-2px)}
.otp.shake{animation:shake .4s}
.setup{padding-top:30px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chipb{padding:10px 16px;border-radius:99px;background:var(--glass);border:1px solid var(--stroke);font-size:15px;transition:background .2s,color .2s}
.chipb.on{background:var(--grad);color:var(--ink);border-color:transparent}

/* home */
.home-h{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:24px 2px 20px}
.date{display:block;font-size:14px;color:var(--text2)}
.date::first-letter{text-transform:uppercase}
.home-h h1{font-size:32px;line-height:1.1;margin-top:4px;overflow-wrap:anywhere}
.ava{width:50px;height:50px;border-radius:50%;background:var(--grad);color:var(--ink);display:grid;place-items:center;font-size:22px;flex:none;box-shadow:0 6px 20px rgba(0,0,0,.2)}
.ava.xl{width:96px;height:96px;font-size:42px;margin-bottom:14px}
.hero{display:flex;align-items:center;gap:18px;padding:20px}
.ring{position:relative;width:86px;height:86px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg);display:block}
.rc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;text-align:center}
.rc b{font-family:"Fraunces",Georgia,serif;font-size:26px;font-weight:500}
.rc small{font-size:11px;color:var(--text2);margin-top:4px}
.rp{transition:stroke-dashoffset 1.1s cubic-bezier(.2,.8,.2,1)}
.flame{display:inline-flex;align-items:center;gap:6px;margin-top:12px;padding:6px 12px;border-radius:99px;background:var(--glass2);font-size:13px;font-weight:500}
.flame svg{color:#ffb35c;flex:none}
.upsell{padding:18px;margin-top:14px;display:flex;flex-direction:column;gap:14px;position:relative;overflow:hidden}
.upsell::after{content:"";position:absolute;inset:-1px;border-radius:24px;padding:1px;background:linear-gradient(120deg,transparent 30%,var(--accent) 50%,transparent 70%);background-size:250% 100%;-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:sheen 4s linear infinite;pointer-events:none}
@keyframes sheen{from{background-position:120% 0}to{background-position:-120% 0}}
.up-top{display:flex;gap:14px;align-items:flex-start}
.cont{display:flex;align-items:center;gap:14px;width:100%;padding:16px;text-align:left;transition:transform .14s}
.cont:active,.tile:active,.srow:active,.act:active,.mode:active{transform:scale(.98)}
.go{width:42px;height:42px;border-radius:50%;background:var(--grad);color:var(--ink);display:grid;place-items:center;flex:none}
.hs{display:flex;gap:12px;overflow-x:auto;margin:0 -20px;padding:2px 20px 6px;scroll-snap-type:x mandatory;scrollbar-width:none}
.hs::-webkit-scrollbar{display:none}
.tile{flex:0 0 158px;scroll-snap-align:start;padding:16px;display:flex;flex-direction:column;gap:16px;text-align:left;transition:transform .14s}
.tile>span:last-child{display:block;width:100%}
.tile .t1{font-size:16px}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mode{padding:16px;display:flex;flex-direction:column;gap:14px;text-align:left;transition:transform .14s}
.mode.wide{grid-column:span 2;flex-direction:row;align-items:center}
.free{display:inline-block;margin-top:8px;padding:3px 9px;border-radius:99px;background:var(--glass2);font-size:12px;color:var(--text2)}
.lockb{width:38px;height:38px;border-radius:50%;background:var(--glass2);display:grid;place-items:center;color:var(--text2);flex:none}

/* subjects */
.search{display:flex;align-items:center;gap:10px;padding:0 16px;height:50px;border-radius:18px;margin-bottom:16px;color:var(--text2)}
.search input{flex:1;min-width:0;background:none;border:none;outline:none;color:var(--text);font-size:16px}
.srow{display:flex;align-items:center;gap:14px;padding:16px;width:100%;margin-bottom:12px;text-align:left;transition:transform .14s}
.meta{display:flex;align-items:center;gap:10px;margin-top:10px}
.meta .mini{flex:1;margin:0;min-width:40px}
.meta .pc{font-size:12px;color:var(--text2);flex:none}
.back-row{padding:16px 0 8px}
.s-hero{display:flex;flex-direction:column;gap:16px;padding:8px 2px 4px}
.s-hero h1{font-size:36px;line-height:1.1;overflow-wrap:anywhere}
.stats2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px}
.stat{padding:16px;min-width:0}
.stat b{display:block;font-family:"Fraunces",Georgia,serif;font-size:28px;font-weight:500;line-height:1.1}
.stat b.sm{font-size:20px;padding:5px 0 3px}
.stat b small{font-size:16px;color:var(--text2)}
.stat span{display:block;font-size:13px;color:var(--text2);margin-top:5px;line-height:1.3}
.act{display:flex;align-items:center;gap:14px;padding:18px 16px;width:100%;margin-top:12px;text-align:left;transition:transform .14s}
.list{overflow:hidden}
.gl-row{display:flex;gap:12px;padding:14px 16px;align-items:flex-start}
.gl-row+.gl-row{border-top:1px solid var(--stroke)}
.gl-row .dot{margin-top:1px;flex:none;color:var(--text3);display:grid}
.gl-row .dot.k{color:var(--ok)}
.gl-t{font-weight:600;font-size:15px}
.gl-d{font-size:14px;color:var(--text2);margin-top:3px;line-height:1.45}
.gl-d.locked{color:var(--text3);font-style:italic}

/* test */
.topbar{display:flex;align-items:center;gap:14px;padding:14px 0 4px}
.bar{flex:1;height:6px;border-radius:99px;background:var(--track);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .5s cubic-bezier(.2,.8,.2,1)}
.count{font-size:14px;color:var(--text2);font-variant-numeric:tabular-nums;flex:none;min-width:42px;text-align:right}
.q-meta{font-size:13px;color:var(--text2);margin:24px 2px 10px}
.q{font-family:"Fraunces",Georgia,serif;font-size:clamp(22px,6vw,27px);font-weight:500;line-height:1.28;letter-spacing:-.01em;margin:0 2px 22px;overflow-wrap:anywhere}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:14px 16px;border-radius:18px;background:var(--glass);border:1px solid var(--stroke);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);font-size:16px;line-height:1.35;transition:transform .14s,background .25s,border-color .25s,opacity .25s}
.opt:active{transform:scale(.985)}
.opt:disabled{cursor:default;color:var(--text)}
.opt .lt{width:32px;height:32px;border-radius:50%;background:var(--glass2);display:grid;place-items:center;flex:none;font-weight:600;font-size:14px;transition:background .25s}
.opt .tx{flex:1;min-width:0;overflow-wrap:anywhere}
.opt.ok{border-color:var(--ok);background:var(--okS);animation:okp .7s ease-out}
.opt.ok .lt{background:var(--ok);color:var(--base)}
.opt.bad{border-color:var(--bad);background:var(--badS);animation:shake .4s}
.opt.bad .lt{background:var(--bad);color:var(--base)}
.opt.dim{opacity:.42}
@keyframes okp{0%{box-shadow:0 0 0 0 var(--ok)}100%{box-shadow:0 0 0 14px transparent}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(2px)}}
.explain{margin-top:16px;padding:16px 18px;animation:rise .35s cubic-bezier(.2,.8,.2,1)}
.ex-h{font-weight:600;font-size:15px;margin-bottom:4px}
.is-ok .ex-h{color:var(--ok)}
.is-bad .ex-h{color:var(--bad)}
.explain p{font-size:15px;color:var(--text2);line-height:1.5}
.dock{margin-top:18px;animation:rise .35s .05s cubic-bezier(.2,.8,.2,1) both}
.spark{position:fixed;width:7px;height:7px;margin:-3px 0 0 -3px;border-radius:50%;background:var(--ok);pointer-events:none;z-index:70;animation:spark .75s cubic-bezier(.15,.8,.25,1) forwards;box-shadow:0 0 8px currentColor}
@keyframes spark{from{transform:translate(0,0) scale(1);opacity:1}to{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}

/* result */
.result{min-height:100%;display:flex;flex-direction:column;justify-content:center;padding:28px 0}
.big-ring{width:170px;height:170px;margin:0 auto 26px}
.big-ring .rc b{font-size:40px}
.big-ring .rc small{font-size:13px}
.result h1{text-align:center;font-size:34px;line-height:1.15}
.result .sub{text-align:center;color:var(--text2);margin-top:8px}
.upline{display:flex;align-items:center;gap:14px;padding:16px;margin-top:14px;text-align:left;width:100%}

/* cards */
.flip{display:block;width:100%;height:clamp(300px,52vh,440px);perspective:1400px;margin-top:22px;cursor:pointer;animation:cardIn .4s cubic-bezier(.2,.8,.2,1)}
@keyframes cardIn{from{opacity:0;transform:translateX(24px) rotate(1.5deg)}to{opacity:1;transform:none}}
.flip-in{position:relative;width:100%;height:100%;transition:transform .7s cubic-bezier(.3,.7,.2,1.1);transform-style:preserve-3d}
.flip.flipped .flip-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:flex;flex-direction:column;padding:20px 22px;border-radius:30px;background:var(--solid);border:1px solid var(--stroke);box-shadow:var(--shadow);-webkit-backface-visibility:hidden;backface-visibility:hidden;overflow:hidden}
.face::before{content:"";position:absolute;right:-60px;top:-60px;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle,var(--o1),transparent 70%);opacity:.6;pointer-events:none}
.face.back{transform:rotateY(180deg)}
.face-top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex:none;position:relative}
.chip{font-size:12px;font-weight:600;padding:5px 11px;border-radius:99px;background:var(--glass2);color:var(--accent);flex:none}
[data-skin="mist"] .chip{background:rgba(61,106,72,.1)}
.face-top .muted{font-size:13px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.face-mid{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;align-items:safe center;justify-content:safe center;padding:16px 4px;text-align:center;scrollbar-width:none;position:relative}
.face-mid::-webkit-scrollbar{display:none}
.face-mid>*{margin:0;width:100%}
.term{font-size:clamp(21px,6vw,34px);line-height:1.2;overflow-wrap:anywhere;word-break:break-word;-webkit-hyphens:auto;hyphens:auto;max-width:100%}
.def{font-size:clamp(15px,4.2vw,19px);line-height:1.5;overflow-wrap:anywhere}
.face-bot{flex:none;text-align:center;font-size:13px;color:var(--text3);position:relative;padding-top:8px}
.card-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}

/* microscope */
.scope{position:relative;width:min(100%,330px);aspect-ratio:1;margin:0 auto;border-radius:50%;overflow:hidden;box-shadow:0 0 0 7px var(--glass2),0 0 0 8px var(--stroke),0 24px 60px rgba(0,0,0,.4);cursor:zoom-in;background:#111}
.scope.z{cursor:zoom-out}
.scope .sv{width:100%;height:100%;transition:transform .6s cubic-bezier(.2,.8,.2,1)}
.scope .sv svg{width:100%;height:100%;display:block}
.scope::after{content:"";position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle,transparent 56%,rgba(0,0,0,.6) 100%);pointer-events:none}
.zoomrow{display:flex;align-items:center;justify-content:center;gap:10px;margin:16px 0 18px}
.zoomrow .t2{margin:0}
.slide-note{text-align:center;font-size:12px;color:var(--text3);margin-top:16px;line-height:1.5}

/* diagram */
.prompt{padding:16px 18px;margin:4px 0 8px;text-align:center}
.prompt .t2{margin:0 0 4px}
.prompt .big{font-family:"Fraunces",Georgia,serif;font-size:26px;line-height:1.15;animation:rise .35s cubic-bezier(.2,.8,.2,1)}
.diag{width:100%;max-width:340px;margin:0 auto}
.diag svg{width:100%;height:auto;display:block;overflow:visible}
.part{fill:var(--glass2);stroke:var(--text3);stroke-width:1.5;cursor:pointer;transition:fill .35s,fill-opacity .35s}
.part:hover{fill:var(--stroke)}
.part.found{fill:var(--accent);fill-opacity:.55;stroke:var(--accent)}
.part.wrongf{animation:wf .6s}
.part.hint{animation:hintp .5s 2}
@keyframes wf{0%,100%{fill:var(--glass2)}40%{fill:var(--bad)}}
@keyframes hintp{50%{fill:var(--ok);fill-opacity:.8}}
.cav{fill:none;stroke:var(--text3);stroke-dasharray:3 5;pointer-events:none}
.dline{stroke:var(--text2);stroke-width:1}
.ddot{fill:var(--accent)}
.dlabel{font-size:12.5px;fill:var(--text);font-weight:600;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
.lab{animation:fadein .5s ease both}
@keyframes fadein{from{opacity:0}to{opacity:1}}

/* blitz */
.bl-head{display:flex;align-items:center;gap:16px;margin-top:22px}
.bl-head .ring{width:74px;height:74px}
.stmt{padding:28px 22px;min-height:200px;display:flex;align-items:center;justify-content:center;text-align:center;margin-top:22px;font-size:clamp(22px,6vw,26px);line-height:1.3;transition:box-shadow .3s}
.stmt.pop{animation:pop .35s cubic-bezier(.2,.8,.2,1)}
.stmt.good{box-shadow:0 0 0 2px var(--ok),var(--shadow)}
.stmt.badf{box-shadow:0 0 0 2px var(--bad),var(--shadow);animation:shake .35s}
@keyframes pop{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
.yn{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.btn.no{background:var(--badS);color:var(--bad);border:1px solid var(--bad);box-shadow:none}
.btn.yes{background:var(--okS);color:var(--ok);border:1px solid var(--ok);box-shadow:none}
.bl-last .ring svg .rp2{stroke:var(--bad)}

/* profile */
.p-head{display:flex;flex-direction:column;align-items:center;text-align:center;padding:30px 0 6px}
.p-name{font-size:30px;line-height:1.15;overflow-wrap:anywhere}
.p-course{color:var(--text2);margin-top:5px;font-size:15px;overflow-wrap:anywhere}
.edit{margin-top:16px;padding:9px 18px;border-radius:99px;font-size:14px;font-weight:500}
.ach{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.a{padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.a .ai{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:var(--grad);color:var(--ink)}
.a.lock .ai{background:var(--glass2);color:var(--text3)}
.a .at{font-weight:600;font-size:15px;line-height:1.25}
.a .ad{font-size:13px;color:var(--text2);line-height:1.4;margin-top:3px}
.a .ap{display:flex;align-items:center;gap:8px;margin-top:auto}
.a .ap .mini{flex:1;margin:0}
.a .ap span{font-size:12px;color:var(--text2);font-variant-numeric:tabular-nums;flex:none}

/* settings */
.row{display:flex;align-items:center;gap:12px;padding:0 16px;min-height:56px;width:100%;text-align:left}
.row+.row{border-top:1px solid var(--stroke)}
.row .k{flex:none}
.row .ri{color:var(--text2);display:grid;flex:none}
.row .val{font-size:15px;color:var(--text2);min-width:0;max-width:58%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:none}
.row.accent{color:var(--accent);font-weight:600}
.row.accent .ri{color:var(--accent)}
.row.danger{color:var(--bad);font-weight:500}
.row.danger .ri{color:var(--bad)}
.row .sub2{display:block;font-size:12px;color:var(--text3);margin-top:2px}
.rowtx{padding:12px 0}
.inp{flex:1;min-width:0;background:none;border:none;outline:none;text-align:right;color:var(--text2);font-size:16px}
.skins{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:10px}
.sk{display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px 2px;border-radius:18px;border:1.5px solid transparent;font-size:12px;font-weight:500;text-align:center;transition:background .2s,border-color .2s}
.sk.on{border-color:var(--accent);background:var(--glass2)}
.sk i{width:42px;height:42px;border-radius:50%;display:block;border:1px solid var(--stroke);box-shadow:0 4px 12px rgba(0,0,0,.2)}
.goal-h{padding:16px 16px 12px;display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.goal-h span:last-child{font-size:14px;color:var(--text2)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:4px;margin:0 14px 14px;border-radius:14px;background:var(--track)}
.seg button{height:38px;border-radius:11px;font-size:15px;font-weight:500;text-align:center;color:var(--text2);transition:background .2s,color .2s}
.seg button.on{background:var(--solid);color:var(--text);box-shadow:0 2px 8px rgba(0,0,0,.15)}
.sw{width:52px;height:32px;border-radius:99px;background:var(--track);position:relative;flex:none;transition:background .25s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.25);transition:transform .3s cubic-bezier(.3,.7,.2,1.2)}
.sw.on{background:var(--ok)}
.sw.on::after{transform:translateX(20px)}
.dev{display:flex;align-items:center;gap:14px;padding:16px;margin-top:26px}
.dava{width:50px;height:50px;border-radius:16px;background:linear-gradient(135deg,#37aee2,#1e88d0);color:#fff;display:grid;place-items:center;flex:none}
.tg{display:inline-flex;align-items:center;gap:6px;padding:10px 14px;border-radius:99px;background:var(--grad);color:var(--ink);font-size:14px;font-weight:600;text-decoration:none;flex:none}
.note{text-align:center;font-size:12px;color:var(--text3);margin:18px 20px 0;line-height:1.5}

/* paywall & pay */
.pw-hero{text-align:center;padding:4px 0 6px}
.pw-hero h1{font-size:32px;line-height:1.12}
.crown{width:86px;height:86px;margin:8px auto 18px;border-radius:28px;display:grid;place-items:center;background:var(--grad);color:var(--ink);position:relative}
.crown::before,.crown::after{content:"";position:absolute;inset:-10px;border-radius:36px;border:1px solid var(--accent);opacity:0;animation:halo 2.6s ease-out infinite}
.crown::after{animation-delay:1.3s}
@keyframes halo{from{transform:scale(.9);opacity:.7}to{transform:scale(1.3);opacity:0}}
.feats{margin-top:20px}
.feat{display:flex;gap:12px;align-items:flex-start;padding:13px 16px;font-size:15px;line-height:1.4}
.feat+.feat{border-top:1px solid var(--stroke)}
.feat .fi{color:var(--ok);flex:none;display:grid;margin-top:1px}
.plans{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:22px}
.plan{padding:18px 16px 16px;text-align:left;border-radius:22px;position:relative;border:1.5px solid var(--stroke);background:var(--glass);transition:border-color .25s,background .25s,transform .14s}
.plan:active{transform:scale(.98)}
.plan.on{border-color:var(--accent);background:var(--glass2)}
.plan .pn{font-size:14px;color:var(--text2)}
.plan .pp{font-family:"Fraunces",Georgia,serif;font-size:27px;margin-top:6px;line-height:1.1}
.plan .ps{font-size:12px;color:var(--text2);margin-top:4px}
.save{position:absolute;top:-10px;right:12px;padding:3px 9px;border-radius:99px;background:var(--grad);color:var(--ink);font-size:11px;font-weight:700}
.pay-h{font-size:30px;text-align:center;margin-top:6px}
.amount{text-align:center;margin-top:10px}
.amount b{font-family:"Fraunces",Georgia,serif;font-size:42px;font-weight:500;display:block;line-height:1.1}
.qrcard{background:#fff;border-radius:28px;padding:18px;margin:20px auto 0;width:min(100%,280px);box-shadow:0 24px 60px rgba(0,0,0,.35);animation:qrIn .6s cubic-bezier(.2,.8,.2,1)}
@keyframes qrIn{from{opacity:0;transform:scale(.92) rotate(-2deg)}to{opacity:1;transform:none}}
.qrcard svg{width:100%;height:auto;display:block}
.qrcap{display:flex;justify-content:space-between;align-items:center;margin-top:12px;color:#0b1630;font-size:12px;font-weight:600;gap:8px}
.sbp{padding:3px 9px;border-radius:8px;background:linear-gradient(135deg,#5b57a2,#1d9bd7 50%,#0f9d58);color:#fff;font-size:11px;font-weight:700;letter-spacing:.02em}
.steps{margin-top:18px}
.step{display:flex;gap:12px;padding:12px 16px;align-items:center;font-size:15px}
.step+.step{border-top:1px solid var(--stroke)}
.sn{width:26px;height:26px;border-radius:50%;background:var(--glass2);display:grid;place-items:center;font-size:13px;font-weight:600;flex:none}
.checking{min-height:70vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center}
.spinner{width:52px;height:52px;border-radius:50%;border:3px solid var(--track);border-top-color:var(--accent);animation:spin .9s linear infinite;margin-bottom:8px}
.okmark{width:120px;height:120px;margin:0 auto 22px}
.okmark svg{width:100%;height:100%;overflow:visible}
.okc{fill:var(--okS);stroke:var(--ok);stroke-width:3;transform-origin:50px 50px;animation:popc .5s cubic-bezier(.2,1.4,.4,1) both}
.okp{fill:none;stroke:var(--ok);stroke-width:6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:70;stroke-dashoffset:70;animation:draw .5s .35s ease-out forwards}
@keyframes popc{from{transform:scale(.3);opacity:0}to{transform:none;opacity:1}}
@keyframes draw{to{stroke-dashoffset:0}}
.receipt{margin-top:22px}
.receipt .row{min-height:50px;font-size:15px}

/* tab bar & toast */
.tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 12px);width:min(488px,calc(100% - 32px));display:flex;gap:4px;padding:7px;border-radius:32px;z-index:20}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 7px;border-radius:24px;color:var(--text2);font-size:11px;font-weight:500;text-align:center;transition:background .25s,color .25s}
.tab .ti{display:grid;transition:transform .3s cubic-bezier(.2,1.4,.4,1)}
.tab.on{color:var(--text);background:var(--glass2)}
.tab.on .ti{color:var(--accent);transform:translateY(-1px) scale(1.08)}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 12px);transform:translate(-50%,-150%);width:min(460px,calc(100% - 32px));display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:22px;z-index:80;background:var(--solid)!important;transition:transform .55s cubic-bezier(.2,1.1,.3,1)}
.toast.in{transform:translate(-50%,0)}
.tico{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:var(--glass2);color:var(--accent);flex:none}
.tico.ach{background:var(--grad);color:var(--ink)}
.toast .t1{font-size:15px}

/* custom decks */
.deckname{display:flex;align-items:center;gap:10px;padding:4px 18px;border-radius:22px;margin-top:6px;color:var(--text3)}
.deckname input{flex:1;min-width:0;background:none;border:none;outline:none;color:var(--text);font-family:"Fraunces",Georgia,serif;font-size:28px;font-weight:500;letter-spacing:-.02em;padding:10px 0}
.ta{display:block;width:100%;min-height:140px;padding:16px 18px;border-radius:22px;background:var(--glass);border:1px solid var(--stroke);color:var(--text);font:inherit;font-size:16px;line-height:1.5;resize:vertical;outline:none;transition:border-color .2s}
.ta:focus{border-color:var(--accent)}
.ta::placeholder{color:var(--text3)}
.ta.big{min-height:230px}
.photo{display:flex;align-items:center;gap:14px;padding:14px;width:100%;text-align:left}
.photo img{width:64px;height:64px;border-radius:14px;object-fit:cover;flex:none}
.thumb{width:46px;height:46px;border-radius:12px;object-fit:cover;flex:none}
.cimg{display:block;max-width:100%;max-height:150px;border-radius:16px;object-fit:cover;margin:0 auto 16px}
.empty{padding:24px 20px;text-align:center}
.empty .bub{margin:0 auto 12px}
.example{padding:14px 16px;font-size:14px;color:var(--text2);line-height:1.7;margin-top:14px}
.example b{color:var(--text);font-weight:600}
.cnt{font-size:14px;color:var(--text2);margin:10px 6px 0}
.gl-row.tap{cursor:pointer;width:100%;text-align:left;align-items:center;transition:background .2s}
.gl-row.tap:active{background:var(--glass2)}
.gl-row.tap .gl-t{display:block}
.gl-row.tap .gl-d{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* multi-select */
.opt.sel{border-color:var(--accent);background:var(--glass2)}
.opt.sel .lt{background:var(--accent);color:var(--ink)}
.need{display:inline-flex;align-items:center;gap:6px;margin:-8px 2px 16px;padding:5px 11px;border-radius:99px;background:var(--glass2);font-size:13px;color:var(--text2)}

/* courses & sections */
.courses{display:flex;gap:8px;overflow-x:auto;margin:0 -20px 16px;padding:2px 20px 4px;scrollbar-width:none}
.courses::-webkit-scrollbar{display:none}
.cchip{flex:none;padding:10px 16px;border-radius:99px;background:var(--glass);border:1px solid var(--stroke);font-size:15px;font-weight:500;color:var(--text2);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);transition:background .2s,color .2s}
.cchip.on{background:var(--grad);color:var(--ink);border-color:transparent}
.cchip .dotc{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--ok);margin-left:6px;vertical-align:middle}
.cchip.on .dotc{background:var(--ink)}
.row .sn{margin-right:2px}
.demo{display:inline-block;margin-left:6px;padding:2px 7px;border-radius:99px;background:var(--glass2);font-size:11px;font-weight:500;color:var(--text2);vertical-align:middle}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .okp{stroke-dashoffset:0}
}
</style>
</head>

<script>
/* ================= icons ================= */
const ICONS={
  home:'<path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
  book:'<path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>',
  user:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',
  sliders:'<path d="M20 7h-9"/><path d="M14 17H4"/><circle cx="17" cy="17" r="3"/><circle cx="7" cy="7" r="3"/>',
