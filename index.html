function startBlitz(){if(!isPro()){sfx("soft");go("paywall");return;}BL={list:shuffle(BLITZ),i:0,score:0,wrong:0,end:Date.now()+60000,timer:null,lastSec:60,newBest:false};go("blitz");}
function tickBlitz(){const left=Math.max(0,BL.end-Date.now());const sec=Math.ceil(left/1000);const bt=document.getElementById("bt"),br=document.getElementById("bring");
  if(bt)bt.textContent=sec;if(br){const L=2*Math.PI*42;br.style.strokeDashoffset=(L*(1-left/60000)).toFixed(2);br.style.stroke=sec<=10?"var(--bad)":"var(--accent)";}
  if(sec!==BL.lastSec){BL.lastSec=sec;if(sec<=5&&sec>0)sfx("tick");}
  if(left<=0){clearInterval(BL.timer);BL.timer=null;finishBlitz();}}
function blAnswer(v){if(!BL||!BL.timer)return;const st=BL.list[BL.i%BL.list.length];const ok=st[1]===v;const el=document.getElementById("stmt");
  if(ok){BL.score++;sfx("ok");buzz(8);}else{BL.wrong++;sfx("bad");buzz([25,30,25]);}
  BL.i++;const nx=BL.list[BL.i%BL.list.length];el.classList.remove("pop","good","badf");void el.offsetWidth;el.classList.add(ok?"good":"badf");
  setTimeout(()=>{el.classList.remove("good","badf");el.textContent=nx[0];void el.offsetWidth;el.classList.add("pop");},160);
  document.getElementById("bs").textContent="Очки: "+BL.score;}
function finishBlitz(){if(BL.score>A.blitzBest){BL.newBest=A.blitzBest>0;A.blitzBest=BL.score;}activity(BL.score);save();go("blitzDone");if(BL.newBest){sfx("achieve");confetti();}checkAch();}
function toPay(){PAY={plan:payPlan,stage:"qr"};go("pay");}
function paidCheck(){PAY.stage="checking";render(false);setTimeout(()=>{const P=PLANS[PAY.plan];const base=isPro()?A.planUntil:Date.now();A.plan="pro";A.planKind=PAY.plan;A.planUntil=base+P.days*864e5;A.autoRenew=true;save();sfx("pay");buzz([20,60,20,60,40]);go("paid");},1900);}
function pickImage(file){return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const M=720,sc=Math.min(1,M/Math.max(im.width,im.height));const cv=document.createElement("canvas");cv.width=Math.round(im.width*sc);cv.height=Math.round(im.height*sc);cv.getContext("2d").drawImage(im,0,0,cv.width,cv.height);res(cv.toDataURL("image/jpeg",.72));};im.onerror=rej;im.src=fr.result;};fr.onerror=rej;fr.readAsDataURL(file);});}
function openDecks(){if(!isPro()){sfx("soft");go("paywall");return;}go("decks");}
function newDeck(){const d={id:uid(),name:"Новая колода",cards:[],created:Date.now(),fresh:true};A.decks.unshift(d);save();go("deck",d.id);}
function studyDeck(id){const d=deckById(id);if(!d||!d.cards.length)return;C={deck:id,order:shuffle(d.cards.map((_,i)=>i)),i:0,k:0,l:0};go("cards");}
function openCard(cardId){const d=deckById(curDeck);const c=cardId?d.cards.find(x=>x.id===cardId):null;CE={deckId:d.id,cardId:c?c.id:null,t:c?c.t:"",d:c?c.d:"",img:c?c.img||null:null};go("cardEdit");}
function ceSave(more){const t=(CE.t||"").trim(),dd=(CE.d||"").trim();if(!t||!dd){showErr("Заполни термин и определение");sfx("bad");return;}
  const d=deckById(CE.deckId);let card;
  if(CE.cardId){card=d.cards.find(x=>x.id===CE.cardId);card.t=t;card.d=dd;card.img=CE.img||null;}
  else{card={id:uid(),t,d:dd,img:CE.img||null,k:false};d.cards.push(card);}
  if(!save()){if(card.img){card.img=null;save();toast("Фото не поместилось","Память браузера заполнена, карточка сохранена без фото","image");}}
  sfx("know");buzz(10);checkAch();
  if(more){toast("Карточка добавлена",esc(t),"check");CE={deckId:d.id,cardId:null,t:"",d:"",img:null};render(true);}
  else go("deck",d.id);}
function quit(){const n=route.name;if(n==="cards"&&C&&C.deck){go("deck",C.deck);return;}if(n==="test"&&T&&!T.mix)go("subject",T.sid);else if(n==="cards"&&C)go("subject",C.sid);else go("home");}

/* ================= events ================= */
const SILENT=new Set(["toggle","check","pick","spick","know","again","flip","zoom","part","bl","send-code","verify","paid-check","setup-done","start-blitz"]);
document.addEventListener("click",e=>{
  const el=e.target.closest("[data-act]");if(!el)return;
  const a=el.dataset.act,g=el.dataset.arg;
  if(!SILENT.has(a)){sfx("tap");buzz(6);}
  switch(a){
    case "tab":resetArm=false;go(g);break;
    case "open-sub":go("subject",g);break;
    case "back":go(lastTab==="home"?"home":"subjects");break;
    case "back-home":pendingAfter=null;if(A)go("paywall");else render(false);break;
    case "start-test":startTest(g);break;
    case "start-mix":startMix();break;
    case "pick":pick(+g,el);break;
    case "toggle":toggleOpt(+g,el);break;
    case "start-sec":{const [sid,sec]=g.split(":");startTest(sid,sec);break;}
    case "course-view":A.viewCourse=+g;save();render(false);break;
    case "check":checkMulti(el);break;
    case "next":nextQ();break;
    case "quit":quit();break;
    case "start-cards":startCards(g);break;
    case "flip":el.classList.toggle("flipped");sfx("flip");buzz(6);break;
    case "know":cardAnswer(true);break;
    case "again":cardAnswer(false);break;
    case "retry":R.mix?startMix():startTest(R.sid,R.sec);break;
    case "start-slides":startSlides();break;
    case "spick":spick(+g,el);break;
    case "snext":snext();break;
    case "zoom":zoom(el,e);break;
    case "start-diagram":startDiagram();break;
    case "part":partTap(g,el,e);break;
    case "start-blitz":startBlitz();break;
    case "bl":blAnswer(g==="1");break;
    case "decks":openDecks();break;
    case "decks-back":go(lastTab==="home"?"home":"subjects");break;
    case "new-deck":newDeck();break;
    case "open-deck":go("deck",g);break;
    case "study-deck":studyDeck(g);break;
    case "card-new":openCard(null);break;
    case "card-edit":openCard(g);break;
    case "ce-photo":document.getElementById("ceFile").click();break;
    case "ce-photo-del":CE.img=null;render(false);break;
    case "ce-save":ceSave(false);break;
    case "ce-save-more":ceSave(true);break;
    case "ce-close":go("deck",CE.deckId);break;
    case "ce-del":if(!ceDelArm){ceDelArm=true;render(false);}else{const d=deckById(CE.deckId);d.cards=d.cards.filter(x=>x.id!==CE.cardId);save();toast("Карточка удалена","","trash");go("deck",d.id);}break;
    case "deck-import":go("deckImport",curDeck);break;
    case "imp-add":{const d=deckById(curDeck);const items=parseList(document.getElementById("imp").value);items.forEach(it=>d.cards.push({id:uid(),t:it.t,d:it.d,img:null,k:false}));save();sfx("achieve");toast(`Добавлено ${items.length} ${plural(items.length,CARDW)}`,esc(d.name),"list");checkAch();go("deck",d.id);break;}
    case "deck-del":if(!deckDelArm){deckDelArm=true;render(false);}else{A.decks=A.decks.filter(x=>x.id!==curDeck);save();toast("Колода удалена","","trash");go("decks");}break;
    case "paywall":go("paywall");break;
    case "pw-close":go(lastTab);break;
    case "plan":payPlan=g;render(false);break;
    case "to-pay":toPay();break;
    case "login-buy":pendingAfter="buy";DB.session=null;A=null;save();go("auth");break;
    case "paid-check":paidCheck();break;
    case "bank":toast("Переход в банк","В рабочей версии здесь откроется приложение банка","send");break;
    case "send-code":sendCode();break;
    case "verify":verify();break;
    case "resend":toast("Код отправлен повторно",esc(pendingEmail),"mail");startResend();break;
    case "to-auth":pendingAfter=null;if(isGuest()){DB.session=null;A=null;save();}go("auth");break;
    case "guest":enterGuest();break;
    case "course":setupCourse=+g;view.querySelectorAll("#courses .chipb").forEach(b=>b.classList.toggle("on",b.dataset.arg===g));break;
    case "setup-done":setupDone();break;
    case "skin":A.skin=g;DB.device.skin=g;save();render(false);break;
    case "goal":A.goal=+g;save();render(false);break;
    case "sound":A.sound=A.sound===false;DB.device.sound=A.sound;save();render(false);if(A.sound)sfx("know");break;
    case "haptics":A.haptics=A.haptics===false;DB.device.haptics=A.haptics;save();render(false);buzz(20);break;
    case "renew":A.autoRenew=!A.autoRenew;save();render(false);toast(A.autoRenew?"Автопродление включено":"Автопродление отключено",A.autoRenew?"":"Премиум действует до "+dateLong(A.planUntil),"refresh");break;
    case "restore":if(isGuest())toast("Нужен вход","Войди по почте, на которую оформляли подписку","mail");else toast(isPro()?"Подписка найдена":"Покупки не найдены",isPro()?"Премиум активен до "+dateLong(A.planUntil):"На этой почте нет активной подписки","refresh");break;
    case "logout":DB.session=null;A=null;save();pendingEmail="";go("auth");break;
    case "reset":
      if(!resetArm){resetArm=true;render(false);setTimeout(()=>{if(resetArm){resetArm=false;if(route.name==="settings")render(false);}},4000);}
      else{PROGRESS.forEach(k=>{A[k]=JSON.parse(JSON.stringify(acctDefault("")[k]));});save();resetArm=false;render(false);toast("Прогресс сброшен","Подписка и профиль сохранены","refresh");}
      break;
  }
});
document.addEventListener("keydown",e=>{if((e.key==="Enter"||e.key===" ")&&e.target.matches('[role="button"][data-act]')){e.preventDefault();e.target.click();}});
view.addEventListener("input",e=>{const f=e.target.dataset.field;if(f&&A){A[f]=e.target.value.trim();save();}if(e.target.dataset.ce&&CE){CE[e.target.dataset.ce]=e.target.value;}if(e.target.id==="deckName"){const d=deckById(curDeck);if(d){d.name=e.target.value.trim()||"Без названия";save();}}});

render(true);
</script>
</body>
