енного дыхания. Одышка возникает вследствие раздражения дыхательного центра а) гиперкапнией через хеморецепторы синокаротидной зоны и вентрального отдела продолговатого мозга; б) рефлекторно при раздражении рецепторов, расположенных в самой легочной ткани и реагирующих на растяжение альвеол и…","sec":"qa"},{"t":"Жалобы при заболеваниях органов дыхания","d":"Боль (dolor) в грудной клетке может быть обусловлена поражением элементов системы дыхания, особенно плевры, ребер, межреберных мышц, нервов и т.д., а также других систем, например сердечно-сосудистой, опорно-двигательной. Боль должна быть детализована: необходимо указать локализацию, характер, интенсивность, продолжительность, условия возникновения и купирование боли. При заболевании трахеи и бронхов боль локализуется за грудиной,…","sec":"qa"},{"t":"Побочные дыхательные шумы. Причины и механизм развития. Их дифференциальная диагностика","d":"Побочные дыхательные шумы. Хрипы (rhonchi) – дополнительные шумы, возникающие в воздухоносном пространстве дыхательных путей легких при наличии жидкого содержимого, при нарушении дыхательной проходимости или в результате расправления спавшейся паренхимы легкого в зоне ее структурных изменений или сдавления. По протяженности хрипы могут быть локальными, рассеянными или распространенными. По количеству хрипов они обозначаются как…","sec":"qa"},{"t":"Основные дыхательные шумы. Виды бронхиального и везикулярного дыхания","d":"Основные дыхательные шумы К основным дыхательным шумам относятся различные аускультативные виды дыхания, из которых одини высушиваются над нормальными легкими, а другие – при наличии в них патологических изменений. Основные дыхательные шумы, выслушиваемые над легкими в норме. Везикулярное дыхание. Выслушивается над большей частью поверхности легочной ткани. Оно называется альвеолярным, так как возникает при колебании стенок…","sec":"qa"},{"t":"Кашель, механизм возникновения, характер","d":"Кашель (tussis) – сложнорефлекторный акт защиты и самоочищения дыхательных путей в ответ на раздражение рецепторов глотки, гортани, трахеи, долевых и сегментарных бронхов, плевры. Патологический процесс, локализуется только паренхиме легких или в мелких бронхах, кашлем не сопровождается, пока мокрота не попадет в крупные бронхи. Появление каш ля возможно при раздражении рецепторов блуждающего нерва, расположенных в других органах…","sec":"qa"},{"t":"Классификация шумов сердца, органические шумы, механизм возникновения, их характеристика","d":"Классификация 1. По отношению к фазам сердечных сокращений различают шумы: 1) систолические (выслушиваются в период систолы); 2) диастолические (выслушиваются в период диастолы). 2. По отношению к источнику возникновения: 1) внесердечные; 2) внутрисердечные. 3. По причине, которая вызывает появление шумов: 1) органические. Причина заключается в органическом изменении строения клапанов и отверстий сердца. Чаще всего они возникают…","sec":"qa"},{"t":"Классификация шумов сердца, функциональные шумы, механизм возникновения, их характеристика","d":"Классификация 1. По отношению к фазам сердечных сокращений различают шумы: 1) систолические (выслушиваются в период систолы); 2) диастолические (выслушиваются в период диастолы). 2. По отношению к источнику возникновения: 1) внесердечные; 2) внутрисердечные. 3. По причине, которая вызывает появление шумов: 1) органические. Причина заключается в органическом изменении строения клапанов и отверстий сердца. Чаще всего они возникают…","sec":"qa"},{"t":"Методика исследования и виды артериального давления. Нормы по ВОЗ","d":"Артериальным кровяным давлением называется давление, которое кровь оказывает на стенки артерий. Высота артериального давления зависит от: количества крови, поступающей в сосудистую систему за единицу времени; величины оттока крови через прекапиллярное русло; емкости сосудистой системы; напряжения стенок артериальных сосудов; вязкости крови. Различают: а) Минимальное, или диастолическое, давление - наименьшая величина давления…","sec":"qa"},{"t":"Правила перкуссии сердца; границы относительной и абсолютной тупости сердца","d":"Перкуссия – один из методов клинического обследования. При проведении перкуссии (постукивания пальцем или специальным перкуторным молоточком по поверхности тела) появляется звук. Это связано с тем, что колебания, вызываемые при этом, передаются на исследуемые органы или ткани. Отражая волны, они вызывают колебание воздушных масс, а мы воспринимаем полученные звуковые эффекты с помощью уха. В зависимости от структуры исследуемого…","sec":"qa"},{"t":"Субъективное исследование больных с заболеваниями сердца","d":"Боли в области сердца (кардиалгии). Дня стенокардии характерны: - кратковременный характер боли в сердце (секунды, минуты); - локализация в области грудины с иррадиацией в левое плечо, руку и лопатку; - хороший купирующий эффект нитроглицерина. При кардиалгиях, не связанных с нарушениями коронарного кровотока: - боль продолжительная (более 20 - 25 мин, до нескольких часов); - боль локализуется в области верхушки сердца и/или слева…","sec":"qa"},{"t":"Верхушечный и сердечный толчок, магистральные сосуды. Характеристика, клиническое значение","d":"Верхушечный толчок - это ограниченная ритмичная пульсация, наблюдаемая в пятом межреберье кнутри от средне-ключичной линии, в области верхушки сердца. Верхушечный толчок присутствует всегда, независимо от того, больной человек или здоровый. Для характеристики верхушечного толчка (его локализации, силы и площади) врач кладет плашмя на область сердца ладонь правой руки, а затем, почувствовав верхушечный толчок, пальпирует его…","sec":"qa"},{"t":"Усиленная пульсация во II межреберье справа от грудины свидетельствует о расширении или аневризме восходящей части аорты","d":"Усиленная пульсация в югулярной ямке может быть связана либо с увеличением пульсового давления в аорте при аортальной недостаточности, гипертонической болезни или после значительной физической нагрузки у здоровых лиц, либо с аневризмой дуги аорты. - Появление значительной пульсации во II межреберье слева от грудины свидетельствует о расширении ствола легочной артерии, чаще в результате легочной артериальной гипертензии. У больных…","sec":"qa"},{"t":"Тоны сердца в норме, механизм возникновения, характеристика. Отличие первого тона от второго","d":"Во время сокращений сердца возникают звуковые эффекты, которые выслушиваются методом аускультации и называются сердечными тонами. Их появление связано с колебанием стенок сосудов, сердечных клапанов, движением тока крови во время сердечных сокращений, с колебаниями стенок миокарда. В норме выслушиваются I и II тоны сердца. I тон сердца (систолический) состоит из нескольких компонентов. Исходя из этого тон называется…","sec":"qa"},{"t":"Пульс, методика его определения, его разновидности и диагностическое значение","d":"Пульс представляет собой колебания стенок артериальных сосудов, связанные с поступлением во время систолы в сосудистое русло большого объема крови. Пульс наиболее часто определяют на лучевых артериях, но можно определять его и на сонных, подколенных, бедренных, артериях тыла стопы. Стенку артерии сдавливают до прекращения кровотока и оценивают свойства стенки сосуда выше сдавления – в норме она мягкая, эластичная. Атеросклероз…","sec":"qa"},{"t":"Функциональные и органические шумы сердца, классификация, механизм возникновения","d":"Шумы разделяются на: внутрисердечные и внесердечные. Внутрисердечные шумы делятся на: - органические (связаны с поражением клапанов, сужением сосудов и отверстий, сердечной мышцы), - функциональные (не связаны с поражением клапанов сосудов и сердечной мышцы). Органические шумы делятся на: 1) клапанные и 2) мышечные. К внесердечным шумам относят: 1) шум трения перикарда, 2) плевроперикардиальный шум, 3) кардиопульмональный шум.…","sec":"qa"},{"t":"Субъективное и объективное исследование больных с заболеваниями печени","d":"ЖАЛОБЫ: - Боли, чувство тяжести, полноты в правом подреберье (болевой синдром) - вследствие увеличения печени и растяжения её капсулы из-за воспалительной инфильтрации, серозного отека или застоя желчи, крови, или вследствие воспалительного процесса в желчном пузыре, желчевыводящих путях при спастическом их сокращении, растяжении. При гепатитах боли в правом подреберье ноющего, тупого или распирающего характера, облегчаются от…","sec":"qa"},{"t":"Субъективное исследование больных с заболеваниями мочевыделительной системы","d":"Жалобы больных: 1. Боли различного характера и локализации. Они возникают из-за: - спазма и раздражения мочевыводящих путей; - воспалительного отека слизистой; - растяжения почечной капсулы. При остром и хроническом гломерулонефрите вследствие воспалительного набухания паренхимы почек и растяжения почечной капсулы отмечаются неинтенсивные, но длительные ноющие боли в поясничной области с обеих сторон, чувство тяжести здесь же. При…","sec":"qa"},{"t":"Объективное и лабораторное исследование больных с заболеваниями мочевыделительной системы","d":"ОСМОТР. Кожные покровы бледные с восковидным оттенком. Бледность обусловлена спазмом артериол и сдавлением их отечной жидкостью. Кроме того, у больных с ХПН развивается анемия, в основе которой лежит уменьшение выработки эритропоэ- тина. При ХПН кожа сухая, тургор ее снижен, могут отмечаться следы расчесов, патехиальные высыпания, кровоточивость десен. Facies nephritica: бледное, одутловатое лицо, веки отечные, глазные щели…","sec":"qa"},{"t":"Нарушение частоты, ритма дыхания. Патологические типы дыхания","d":"Принято различать следующие типы характера дыхания. Эупноэ — спокойное нормальное дыхание. Диспноэ — затрудненное, напряженное дыхание с одышкой, иногда с цианозом. Ортопноэ — затрудненное дыхание, при котором ребенок сидит, опираясь на руки (вынужденное положение сидя с упором на руки). Олипноэ — усиленные дыхательные движения, которые обеспечивают большой объем вдоха. Олигопноэ — ослабление дыхательных движений, сопровождающееся…","sec":"qa"},{"t":"Осмотр больных с заболеваниями ССС","d":"Положение больного. - Положение «ортопноэ» у больных с выраженной левожелудочковой недостаточностью - вынужденное положение, при котором уменьшается одышка. Больной сидит с опущенными ногами, при этом голова слегка запрокинута назад и опирается на высокий изголовник или подушки, рот приоткрыт, одышка в покое. В такой позе уменьшается венозный возврат крови к сердцу, разгружается малый круг кровообращения, уменьшается одышка. -…","sec":"qa"},{"t":"Аускультация легких, ??? обоснование, методика, классификация, значение","d":"ОСНОВНЫЕ ДЫХАТЕЛЬНЫЕ ШУМЫ - Везикулярное дыхание выслушивается в норме над всей поверхностью легких в результате колебания альвеолярных стенок. Слышно на протяжении всего вдоха и в первой трети выдоха. Воспринимается как мягкий, дующий шум, напоминающий звук «ф». Физиологическое ослабление везикулярного дыхания наблюдается при утолщении грудной стенки (ожирении). Физиологическое усиление везикулярного дыхания отмечается у людей…","sec":"qa"},{"t":"Типы телосложения. Патологические типы грудной клетки","d":"Формы грудной клетки у здорового человека: - Нормостеническая (отношение переднезаднего размера к поперечному 0,65-0,75; над и подключичные ямки обозначены слабо; угол Людовика отчетливо выражен, эпигастральный угол приближается к 90; ребра в боковых отделах имеют умеренно косое направление; лопатки плотно прилегают к грудной клетке и располагаются на одном уровне; грудной отдел туловища по своей высоте примерно равен брюшному). -…","sec":"qa"},{"t":"Методика и клиническое значение определения голосового дрожания","d":"Пальпацию применяют для определения голосового дрожания (силы проведения голоса на грудную клетку). С этой целью ладони прикладывают к грудной клетке и предлагают больному громко произнести слова, содержащие букву «р» (дает наибольшую вибрацию голоса). Колебания голосовых связок передаются по воздуху, находящемуся в трахее и бронхах, на грудную стенку. Чем ниже голос, тем лучше ощущается голосовое дрожание, так как при этом…","sec":"qa"},{"t":"Методика и техника перкуссии легких. Дыхательная экскурсия легких. Методика определения. Изменения при патологии","d":"ПЕРКУТОРНЫЙ ЗВУК НАД ЛЕГКИМИ В НОРМЕ И ПРИ ПАТОЛОГИИ. В норме над всеми легочными полями перкуторно определяется ясный легочный звук. Это низкий по тональности, громкий и продолжительный звук. Изменение нормального перкуторного звука связано с уменьшением или увеличением воздушности легкого и, соответственно, изменением степени его плотности. В зависимости от меняющихся условий при патологических состояниях над легкими могут…","sec":"qa"},{"t":"Субъективное исследование больных с заболеваниями желудочно-кишечного тракта","d":"К жалобам, характерным для заболеваний пищевода, относятся","sec":"qa"},{"t":"Дисфагия - это затруднение или невозможность полностью проглотить принятую пищу. Различают","d":"Орофарингеалъная - возникает при самых первых глотательных движениях, сочетается с попаданием пищи в полость носа, гортань. При этом у больного появляется кашель. Бывает при некоторых заболеваниях ротовой полости, гортани или чаще при поражении нервной системы. - Эзофагеалъная - возникает после нескольких глотательных актов и сопровождается неприятными ощущениями по ходу пищевода. Встречается при раке пищевода, рубцевании после…","sec":"qa"},{"t":"Расщепление и раздвоение тонов сердца, диагностическое значение","d":"Раздвоение тонов определяется как два коротких самостоятельных звука вместо одного, а расщепление - как не дошедшее до конца разделение одного из тонов на две части. Разница между расщеплением и раздвоением: временной интервал между расщепленными компонентами не превышает 0,04\", поэтому ухо не в состоянии четко уловить этот феномен. В норме над сердцем мы слышим только два чистых неизмененных тона - «Та-та»; при расщеплении I тона…","sec":"qa"},{"t":"По методике перкуссии","d":"Непосредственная, при которой пальцы рук врача ударяют непосредственно по разным участкам тела человека, например, по грудной клетке. В настоящее время она применяется редко, так как качество перкуторного звука при ней плохое. Основные методы этой перкуссии теперь представляют в большей мере лишь академический интерес. - метод Ауэнбруггера - перкуссия производится ударами кончиками II-V пальцев кисти непосредственно по грудной…","sec":"qa"},{"t":"По силе перкуторного удара различают перкуссию","d":"громкую (сильная, глубокая); - тихую (слабая, поверхностная); - тишайшую (предельная, пороговая). Разновидностью тишайшей перкуссии являются перкуссия по Плешу-Гольдшайдеру","sec":"qa"},{"t":"По цели перкуссии","d":"топографическая - для определения границ органов, их величины и формы; - сравнительная - для сравнения звуков над симметричными участками тела. ПРАВИЛА ПЕРКУССИИ - Положение больного должно быть удобным, ненапряженным. Лучше всего, если позволяет состояние, осуществлять перкуссию в положении больного стоя или сидя. - В помещении должно быть тепло и тихо. - Врач должен находиться справа от больного. - Палец-плессиметр (III палец…","sec":"qa"},{"t":"Характеристика статических и динамических дыхательных объемов легких в условиях нормы и при нарушениях функции внешнего ","d":"Методом спирографии исследуют функции легких путем измерения легочных дыхательных объемов, а также выявляют нарушения механики дыхания и резервы дыхательной функции. При исследовании легочного дыхательного объема (ДО) измеряют объем вдыхаемого и выдыхаемого воздуха при спокойном дыхании. Он составляет в среднем 500 мл. Затем определяют жизненную емкость легких (ЖЕЛ). Она равна сумме резервного объема вдоха, резервного объема…","sec":"qa"},{"t":"Трехчленные ритмы: виды, распознавание, диагностическое значение","d":"«Ритм перепела» - при митральном стенозе на верхушке сердца, особенно в положении на левом боку и на выдохе. Его образуют: - Громкий, хлопающий I тон - образуется в силу того, что при митральном стенозе левый желудочек недостаточно наполняется кровью, систола его становится короткой, энергичной, а I тон громким. - После I тона следует II тон. - Через 0,07-0,12 сек. после II тона выслушивается дополнительный тон открытия…","sec":"qa"},{"t":"Причины усиления и ослабления тонов сердца","d":"На звучность (громкость) тонов влияют внесердечные и сердечные причины. Различают усиление и ослабление тонов. ВНЕСЕРДЕЧНЫЕ ПРИЧИНЫ: Ослабление обоих тонов - при утолщении грудной стенки, при ожирении, выраженном развитии мускулатуры плечевого пояса, отёке грудной стенки, при скоплении жидкости в левой плевральной полости, эмфиземе лёгких. Усиление обоих тонов - при похудании, у астеников, при сморщивании краёв лёгких, опухоли…","sec":"qa"},{"t":"Систолическое и пресистолическое дрожание грудной клетки. Методика определения, диагностическое значение","d":"Пальпаторное восприятие сердечных шумов следующее: если легко, без всякого давления, положить ладонь на грудную стенку в области сердца, то в ряде случаев рука воспринимает дрожание, напоминающее пальпаторное ощущение кошачьего мурлыканья. Дрожание, соответствующее систолическому шуму, называется систолическим, соответствующее диастолическому шуму — диастолическим. Практически определить систолическое или диастолическое дрожание…","sec":"qa"},{"t":"Конфигурации сердца. Методика определения. Диагностическое значение","d":"Конфигурация сердца – тот силуэт сердца, который проецируется на переднюю грудную стенку. 1. Определить перкуторно границы сосудистого пучка. 2. Определить границы ОТС в III-IV межреберьях справа и в III и V межреберьях слева. 3. Соединить полученные точки с образованием контуров ОТС Талия сердца – угол, который определяется по левому контуру между сосудистым пучком и дугой левого желудочка. В норме тупой. В соответствии с тем или…","sec":"qa"},{"t":"Методика анализа электрокардиограммы","d":"ПОРЯДОК РАСШИФРОВКИ ЭКГ - Определяется правильность сердечного ритма. Анализируется форма и расположение зубца Р и одинаковость интервала RR. Признаки нормального синусовогоритма: - Положительные зубцы Р во II стандартном отведении, отрицательные - в aVR. - Постоянная форма Р в каждом },{"t":"Недостаточность аортального клапана. Нарушение гемодинамики, симптоматология","d":"При этом пороке в диастолу аортальный клапан полностью не закрывает аортальное отверстие, и часть крови возвращается в левый желудочек, но в это время в него поступает нормальное количество крови и из левого предсердия. Поэтому в диастолу в левом желудочке оказывается больше крови, чем в норме. В итоге он гипертрофируется и в аорту выбрасывает большее, чем в норме, количество крови. Это приводит к повышению систолического…","sec":"qa"},{"t":"Недостаточность митрального клапана. Нарушение геодинамики. Симптоматология","d":"Виды недостаточности: органическая - при ревматизме; функциональная - при нарушении функции миокарда и папиллярных мышц; относительная - клапанный аппарат не изменен, но так как левый желудочек расширен, АВ- отверстие растянуто. Нарушения гемодинамики. При неполном смыкании клапана во время систолы левого желудочка часть крови возвращается в левое предсердие. К началу диастолы в левом предсердии накапливается большее, чем в норме,…","sec":"qa"},{"t":"Недостаточность трехстворчатого клапана. Нарушение геодинамики. Симптоматология","d":"Недостаточность трехстворчатого клапана — неполное смыкание его створок во время систолы правого желудочка. Этиология и патогенез. Различают органическую и относительную недостаточность трехстворчатого клапана. Относительная недостаточность наблюдается у больных с выраженной дилатацией полости желудочка, створки клапана не полностью перекрывают правое атриовентрикулярное отверстие вследствие того, что сухожильное кольцо резко…","sec":"qa"},{"t":"Классификация гемобластозов. Этиология, патогенез. Клиническая картина хронического лейкоза, тактика лечения","d":"Классификация. Гемобластозы делятся на: - Лейкозы: - острые - преобладание молодых, незрелых клеток (лимфобластный, миелобластный, плазмобластный, мегакариобластный, промиелоцитарный, эритромиелоз, эритролейкоз и недифференцируемый вариант). - хронические - преобладание дифф ционирующих клеток печени, узловой регенерацией, резко выраженным фиброзом, перестройкой дольковой структуры паренхимы и сосудистой сети печени и портальной гипертензией. Классификация: I. По этиологии: 1) вирусный (В, С, Д); 2) алкогольный; 3) аутоиммунный; 4)…","sec":"qa"},{"t":"Синдром обтурационного и компрессионного ателектаза. Рак легкого","d":"Ателектаз - состояние легочной ткани, при котором альвеолы не содержат воздуха, от чего их стенки спадаются. - Обтурационный ателектаз развивается при закупорке бронха опухолью, инородным телом, вязким бронхиальным секретом, сдавлении бронха извне опухолью, увеличенными лимфоузлами. В невентилируемой части легкого нередко развивается инфекционно-воспалительный процесс (гнойный бронхит, пневмония), а при длительном ателектазе -…","sec":"qa"},{"t":"Хроническая сердечная недостаточность, патогенез, классификация по Василенко и Стражеско. Клинические проявления","d":"Классификация ХСН - ст. - начальная, или скрытая недостаточность, проявляется в виде одышки и сердцебиения только при значительной физической нагрузке, ранее не вызывавшей ее. - стадия - выраженная, длительная недостаточность кровообращения, нарушения гемодинамики (застой в малом или большом круге кровообращения) при незначительной физической нагрузке, иногда в покое. В этой стадии выделяют 2 периода: период А и период Б. IIA…","sec":"qa"},{"t":"Классификация аритмий сердца. Причины возникновения и распознавание аритмий обусловленных нарушением автоматизма","d":"1. Аритмии при нарушении автоматизма СА-узла","sec":"qa"},{"t":"Синусовая тахикардия","d":"Причины: СН, интоксикации, повышение температуры, анемии, тиреотоксикоз, прием некоторых лекарств. У больных ощущение сердцебиения, небольшая одышка. ЭКГ-признаки: ритм синусовый, правильный, ЧСС больше 100 в 1мин.; укорочение интервала R-R, за счет интервала Т-Р. - Синусовая брадикардия - ЧСС меньше 60 в 1 мин. Причины: синдром слабости синусового узла, повышение тонуса блуждающего нерва (менингит, опухоли головного мозга);…","sec":"qa"},{"t":"Синусовая аритмия","d":"Физиологическая - дыхательная аритмия. Патологическая причина - поражение синусового узла при миокардитах, ревматизме, ИБС. Клинически мало проявляется. ЭКГ-признаки: ритм синусовый, неправильный, интервалы R-R отличаются друг от друга больше чем на 0,1 сек","sec":"qa"},{"t":"Синдром слабости синусового узла","d":"Причины: воспалительные процессы в миокарде, ишемия, дистрофия, некроз, склероз миокарда при ИБС. Жалобы: вначале упорная брадикардия, затем приступы сердцебиений, сменяющиеся брадикардией, аритмичная работа сердца, головокружения, обморочные состояния, общая слабость. ЭКГ-признаки: Упорная брадикардия. Симптом «тахи-бради». Выскальзывающие комплексы и ритмы из нижележащих отделов проводящей системы. Эпизоды СА-блокады, остановки…","sec":"qa"},{"t":"Синдромы желтухи, портальной гипертензии и гепатолиенальный синдром","d":"СИНДРОМ ЖЕЛТУХИ 1. Механическая Причины: ЖКБ с обтурацией общего желчного протока, рак фатерового соска, холестаз. Жалобы: при желчнокаменной болезни желтухе нередко предшествуют приступообразные интенсивные боли в правом подреберье (желчная колика), тошнота, рвота. Характерен зуд кожи, обесцвечивание кала и потемнение мочи (цвета пива). Объективно: осмотр - желтушность склер и кожи, расчесы. Пальпация: увеличенный, болезненный…","sec":"qa"},{"t":"Гемолитическая (подпеченочная","d":"Причины: переливание несовместимой крови, врожденные и приобретенные гемолитические желтухи, ДВС-синдром. Объективно: цвет кожи лимонно-желтый, бледность видимых слизистых. Цвет мочи темно-коричневый с красноватым оттенком. Цвет кала темно-коричневый. Зуд кожи отсутствует. Увеличение печени и селезенки (не постоянно). Общий анализ крови: количество эритроцитов и гемоглобина снижено, цветной показатель нормальный, снижение…","sec":"qa"},{"t":"Паренхиматозная (печеночная","d":"Причины: вирусные гепатиты, цирроз печени, токсические поражения печени. Объективно: цвет кожи желтый с красноватым оттенком. Увеличение размеров печени. Биохимический анализ крови: билирубин свободный и связанный повышены. Повышены активность аминотрансфераз (ACT, АЛТ), альдолазы. Анализ мочи: цвет мочи темно-коричневый с желтой пеной при взбалтывании. Качественные реакции на билирубин и уробилин положительные. Анализ кала: цвет…","sec":"qa"},{"t":"Синдромы мальабсорбции, желудочной и кишечной диспепсии, кишечной колики и острого живота, синдром пищеводно - желудочно","d":"Синдром мальабсорбции - это симптомокомплекс клинических проявлений, возникающих вследствие расстройств процессов абсорбции в тонкой кишке, сочетается с синдромом недостаточности пищеварения. Может быть первичным (врожденная, генетически обусловленная энзимопатия) и вторичным (при хроническом гастрите со сниженной секреторной функцией, болезни Крона, после резекции желудка и части тонкого кишечника, хроническом панкреатите,…","sec":"qa"},{"t":"Характеристика мочевого и нефротического синдромов","d":"НЕФРОТИЧЕСКИЙ СИНДРОМ - это клинико-лабораторный комплекс, состоящий из массивной протеинурии, гипо- и диспротеинемии, гиперлипидемии, выраженных отеков (иногда с водянкой полостей). Выделяют первичный (идиопатический) и вторичный НС. Причины вторичного НС: гломерулонефрит, системные заболевания (СД, СКВ, геморрагический васкулит); повышение давления крови в почках (тромбоз почечных вен, правожелудочковая недостаточность);…","sec":"qa"},{"t":"Гемобластозы. Классификация острых лейкозов, этиология, патогенез, симптоматика, принципы лечения","d":"Классификация. Гемобластозы делятся на: - Лейкозы: - острые - преобладание молодых, незрелых клеток (лимфобластный, миелобластный, плазмобластный, мегакариобластный, промиелоцитарный, эритромиелоз, эритролейкоз и недифференцируемый вариант). - хронические - преобладание дифференцирующихся, более или менее зрелых элементов крови (хронический миелолейкоз, хронический лимфолейкоз, эритромиелоз, эритремия, хронический моноцитарный…","sec":"qa"},{"t":"Печеночная недостаточность. Печеночная кома,  обострение, стихающее обострение, ремиссия","sec":"qa"},{"t":"функциональное состояние желчного пузыря и желчных путей","d":"дискинезия желчных путей по гипертонически-гиперкинетическому типу - дискинезия желчных путей по гипотонически-гиперкинетическому типу; - без дискинезии желчных путей; - «отключенный» желчный пузырь. Выделяют три формы хронического холецистита: гнойно-бактериальную, калькулезную и дискинетическую. Патогенез. Функциональные нарушения нервно-мышечного аппарата приводят к гипо- или атонии желчного пузыря внедрение микробной флоры…","sec":"qa"},{"t":"Синдром острой сосудистой недостаточности (обморок, коллапс, шок","d":"ОСТРАЯ СОСУДИСТАЯ НЕДОСТАТОЧНОСТЬ - это нарушение нормального соотношения между емкостью сосудистого русла и объемом циркулирующей крови, развивается при уменьшении массы крови (кровопотеря, обезвоживание организма) и при падении сосудистого тонуса. Причины падения сосудистого тонуса: - Рефлекторные нарушения вазомоторной иннервации сосудов при травмах, инфаркте миокарда, эмболии легочной артерии. - Нарушения вазомоторной…","sec":"qa"},{"t":"Гипо- и гиперсекреторный синдромы. Гастриты: причины возникновения, симптоматология","d":"ГАСТРИТЫ - поражение желудка воспалительного характера, сопровождающееся дистрофией, лейкоцитарно-плазматической инфильтрацией подслизистого слоя желудка, нарушениями его функции. Различают острые и хронические гастриты. Хронический гастрит - хроническое воспаление слизистой оболочки желудка с перестройкой ее структуры и прогрессирующей атрофией, нарушениями секреторной, моторной и инкреторной функций. Этиология. Это…","sec":"qa"},{"t":"Понятие о гипертензии малого круга кровообращения. Легочное сердце. Методы выявления","d":"ПЕРВИЧНАЯ ЛЕГОЧНАЯ ГИПЕРТЕНЗИЯ. Этиология неизвестна. Патогенез - генетически обусловленное несовершенство центральной регуляции легочного сосудистого тонуса. Гуморальные нарушения (избыток в легких серотонина или дефект его метаболизма). Выделяют 2 формы ПЛГ - врожденную и приобрете Буяльский","d":"18 декабря 1798 г. была учреждена Петербургская медико-хирургическая академия. 17 ноября 1800 г. в академии была организована первая в истории России самостоятельная хирургическая кафедра. Руководителем кафедры со дня открытия по 1833 г. был первый профессор хирургии академии И. Ф. Буш. Иван Федорович Буш — академик Медико-хирургической академии, заслуженный ординарный профессор теоретической и практической хирургии,…","sec":"qa"},{"t":"Послепироговский период в развитии русской хирургии. Основные школы этого периода: Н.В.Склифосовский, А.А.Бобров, Н.А.Ве","d":"Склифосовский был крупным военно-полевым хирургом, участником войн на Балканах, русско-турецкой; он обобщил медицинский опыт этих войн, выступал за приближение медицинской помощи к месту боя, широкое применение гипсовых повязок в качестве средства иммобилизации при переломах конечностей, замену корпии гигроскопической ватой, высказы- вался против скучивания раненых, которое способствует распространению внутригоспитальных инфекций.…","sec":"qa"},{"t":"Выдающиеся деятели отечественной хирургии: В.А.Оппель, А.В.Мартынов, П.А.Герцен","d":"Владимир Андреевич Оппель —Разработал учение об этапном лечении раненых, необходимости приближения активной хирургической помощи раненым к полю боя, специализации полевых госпиталей. Один из первых в стране произвел резекцию шейного отдела пищевода по поводу рака, предложил модификации ряда операций А.В. Мартынов (1868-1934) известен своими работами в области абдоминальной хирургии, хирургии желчных путей и щитовидной железы. Он…","sec":"qa"},{"t":"Выдающиеся деятели отечественной хирургии: С.С.Юдин, А.В.Вишневский, А.Н.Бакулев, Н.Н.Бурденко","d":"Юдин-Основное направление его работ — неотложная абдоминальная хирур- гия, в первую очередь острая патология желудка с установкой на радикаль- ность вмешательств. С. С. Юдин разработал методы замыкания глоточной и кишечной стом, создания кожной трубки при комбинированных методах, выполнил первую анатомическую резекцию печени, одним из первых в мире произвел пластику пищевода внутриплеврально; первым в мире применил в клинике…","sec":"qa"},{"t":"Специализированная хирургическая помощь, оказываемая хирургами в специализированных хирургических отделениях","d":"Организацию срочной и плановой хирургической помощи можно представить в следующей последовательности: 5 – фельдшерско-акушерский пункт (первая медицинская помощь); – участковая больница (выделяются хирургические койки); – районная больница (имеется хирургическое отделение); – областная (краевая) больница (имеются специализированные хирургические отделения); – научно-исследовательский институт (оказывается специализированная…","sec":"qa"},{"t":"Участковые больницы (поликлиники) оказывают экстренную и неотложную хирургическую помощь при некоторых заболеваниях и тр","d":"также руководят работой фельдшерско-акушерских пунктов","sec":"qa"},{"t":"Хирургические отделения центральных районных больниц (ЦРБ) обеспечивают оказание квалифицированной хирургической помощи ","d":"проведении планового лечения наиболее распространенных хирургических заболеваний (грыжесечение, холецистэктомия и др.)","sec":"qa"},{"t":"Специализированные хирургические отделения многопрофильных городских и областных больниц помимо полного объема общехирур","d":"помощи (урологическую, онкологическую, травматологическую, ортопедическую и т.д.). В крупных городах специализированную помощь могут оказывать в стационарах, полностью профилированных в соответствии с тем или иным видом хирургической помощи","sec":"qa"},{"t":"В хирургических клиниках медицинских вузов и институтах последипломной подготовки оказывают как общехирургическую, так и","d":"помощь, проводят научную разработку различных направлений хирургии, обучение студентов, интернов и повышение квалификации врачей","sec":"qa"},{"t":"Научно-исследовательские институты оказывают специализированную хирургическую помощь взависимости от их 6 профиля и явля","d":"Выделяют экстренную (неотложную) и плановую, амбулатор мических веществ, физических факторов Современная асептика базируется на двух основных принципах","sec":"qa"},{"t":"Все хирургические больные должны быть разделены на два потока: \"чистые\" и \"гнойные\"","d":"Основные пути распространения инфекции: 18 Экзогенные – это источники, находящиеся вне организма больного. Эндогенные - это источники, находящиеся в организме больного. Основные экзогенные источники: 1) больные с гнойно-септическими заболеваниями, 2) бациллоносители, 3) животные","sec":"qa"},{"t":"Воздушный путь. Микроорганизмы попадают из окружающего воздуха, где они находятся в свободно взвешенном состоянии или ад","d":"роль, особенно в операционных, реанимационных отделениях и отделениях интенсивной терапии","sec":"qa"},{"t":"Имплантационный путь. Возбудители попадают в ткани организма в случае умышленного оставления там инородного материала Ос","d":"1) воспалительные процессы покровного эпителия (фурун- кулы, карбункулы, пиодермии, экземы и т. д.); 2) очаговая инфекция желудочно-кишечного тракта (кариес зубов, холециститы, халангиты, панкреатиты и т. д.); 3) инфекция дыхательных путей (гаймориты, фронтиты, трахеиты, бронхиты, воспаление легких, бронхоэктазы, абсцессы легких); 4) воспаление урогенитального тракта (пиелиты и циститы, простатиты, уретриты, сальпингоофориты); 5)…","sec":"qa"},{"t":"Зона строгого режима. З. Зона ограниченного режима","d":"4. Зона общебольничного режима (не стерильная). 21 К зоне стерильного режима (1 зона) относятся помещения, в которых выполняются операции, проводится стерилизация хирургического инструментария: операционные, стерилизационные. В помещениях этой зоны предъявляются самые строгие требования по соблюдению асептики. К зоне строгого режима (2 зона) относятся помещения, непосредственно связанные дверью с операционной: предоперационная,…","sec":"qa"},{"t":"Ограничение посещений его. В операционную допускаются работники операционной, операционные бригады, анестезиологические ","d":"Входить в операционную без необходимости запрещается","sec":"qa"},{"t":"В операционной необходимо поддерживать определенный мик-роклимат (температуру, влажность, чистоту воздух). Нарушения тем","d":"больного и привести к развитию осложнений. Оптимальной температурой в операционной считается 22-25˚С при влажности 50%","sec":"qa"},{"t":"Применение приточной вентиляции. для дезинфекции воздуха применяют бактерицидные ультрафиолетовые лампы","d":"21.Виды уборки операционной, разделение потоков больных, борьба с воздушно-капельной инфекцией. Для этого предусмотрено выполнение нескольких видов уборки: 1) предварительная, 2) текущая, 3) послеоперационная, 4) заключительная и 22 5) генеральная. Предварительная. Утром перед началом операций протирают влажной тряпкой горизонтальные поверхности (пол, столы, подоконники), чтобы удалить пыль, осевшую за ночь из воздуха. Текущая…","sec":"qa"},{"t":"Обработка производится многократно. Первый раз смазывают операционное поле перед наложением стерильного белья, второй – ","d":"третий – перед зашиванием кожи и четвертый раз – после наложения швов на кожу. Как показали многочисленные исследования, йод дубит кожу и, проникая в глубину складок и пор, дезинфицирует ее. Для обработки операционного поля используются и другие антисептические вещества (1 % раствор дегмицида, 1 % раствор роккала или катамина А-Б, 2,4 % раствор первомура). Для дезинфекции слизистых их смазывают 1 % раствором бриллиантового…","sec":"qa"},{"t":"Локализация раны. Особенно болезненны раны в местах, где имеется большое количество болевых рецепторов (кожа в области к","d":"плевра). Повреждение клетчатки, мышц и фасций в меньшей степени влияет на интенсивность болевого синдрома","sec":"qa"},{"t":"Нервно-психическое состояние пациента. Болевые ощущения могут быть снижены при пребывании пострадавшего в состоянии аффе","d":"опьянения. Боль полностью отсутствует при выполнении операции под наркозом, а также при таком заболевании, как сирингомиелия (поражается серое вещество спинного мозга). Боль является защитной реакцией организма, но длительные интенсивные боли вызывают истощение центральной нервной системы (ЦНС), что неблагоприятно сказывается на функциях жизненно важных органов. Кровотечение (haemorrhagia) Кровотечение - обязательный признак раны,…","sec":"qa"},{"t":"Состояние свёртывающей системы. При его нарушениях (например, при гемофилии) повреждение сосудов даже небольшого калибра","d":"даже смерти. Зияние (hiatus) Зияние раны обусловлено сокращением эластических волокон кожи. Выраженность расхождения кожных краёв раны прежде всего определяется отношением её оси к линиям Лангера, показывающим основные направления расположения грубоволокнистых структур кожи (рис. 4-1). Так для уменьшения зияния при оперативных вмешательствах на верхних и нижних конечностях преимущественно выбирается продольное направление…","sec":"qa"},{"t":"Послойное зашивание раны наглухо производят при небольших ранах с малой зоной повреждения (резаные, колотые и пр.), мало","d":"верхних конечностях при малом сроке с момента повреждения","sec":"qa"},{"t":"Зашивание раны с оставлением дренажа (дренажей) выполняют в тех случаях, когда либо есть риск развития инфекции, но он о","d":"велика зона повреждения, либо ПХО выполняется через 6-12 ч от момента повреждения, либо у больного есть сопутствующая патология, неблагоприятно влияющая на раневой процесс, и т.д., т.е. при риске развития инфекции","sec":"qa"},{"t":"Рану не зашивают при высоком риске инфекционных осложнений: - поздняя ПХО; - обильное загрязнение раны землёй; - массивн","d":"сопутствующие заболевания (анемия, иммунодефицит, сахарный диабет); - локализация на стопе или голени; - пожилой возраст пациента. Не следует зашивать огнестрельные раны, а также любые раны при оказании помощи в военное время. Зашивание раны наглухо при неблагоприятных факторах является совершенно неоправданным риском и явной тактической ошибкой хирурга! Основные виды Чем раньше от момента повреждения выполнена ПХО раны, тем ниже…","sec":"qa"},{"t":"Веноспазм. Первоначально развивается венозный спазм. Вены обладают хорошо развитым моторным механизмом, который позволяе","d":"объему крови. Как указывалось, в вены содержат 70—80 % ОЦК. Благодаря венозному спазму венозный возврат к сердцу остается прежним, ЦВД в пределах нормальных показателей. Однако если кровопотеря продолжается и достигает 10 %, этот компенсаторный механизм уже не обеспечивает сохранение величины венозного возврата и он уменьшается","sec":"qa"},{"t":"Тахикардия. Уменьшение венозного возврата приводит к снижению сердечного выброса. Компенсации этих сдвигов осуществляетс","d":"нарастание тахикардии. Поэтому минутный объем сердца долго остается на прежнем уровне. Уменьшение венозного возврата до 25-30 % уже не компенсируется учащением сердечных сокращений. Развивается синдром малого выброса (снижение сердечного выброса). Для поддержания адекватного кровотока начинает срабатывать следующий механизм компенсации- переферическая вазоконстрикция","sec":"qa"},{"t":"Переферическая вазоконстрикция. Благодаря периферическому артериолоспазму давление поддерживается на уровне выше критиче","d":"подвергаются вазоконстрикции мозговые и коронарные артерии. Развивается феномен - «централизация кровообращения». Периферическая вазоконстрикция – это переходный этап от компенсаторных реакций к патологическим","sec":"qa"},{"t":"Централизация кровообращения. Благодаря централизации кровообращения в головном мозге, легких и сердце обеспечивается ад","d":"Кроме реакции сосудистого русла срабатывают и другие компенсаторные механизмы. 5.Приток тканевой жидкости. Следствием компенсаторной перестройки гемодинамики является снижение гидростатического давления в капиллярах. Это приводит к переходу межклеточной жидкости в сосудистое русло. Благодаря этому механизму ОЦК может увеличиться до 10-15 %. Приток жидкости приводит к гемодилюции. Развивающаяся гемодилюция улучшает реологические…","sec":"qa"},{"t":"Закручивание и раздавливание сосуда. 2.Перевязка сосуда. (перевязка в ране; перевязка на протяжении, Прошивание сосуда. ","d":"органа.) Физические методы основаны на использовании: 1. высокой или низкой температуры, 2. лазерного излучения, 3. плазмы. Химические методы основаны на применении различных химических веществ. Они могут оказывать местное и резорбтивное действие. Препараты местного действия - стимуляция тромбообразования, сосудосуживающем и тампонирующем эффекте. Перекись водорода Кислота аминокапроновая. Препараты из желатина. Рассасывающийся…","sec":"qa"},{"t":"Кровь и её препараты. Переливание крови обладает гемостатическим эффектом. Однако в настоящее время целенаправлено для о","d":"расчитывать на гемостатический эффект при переливании её с заместительной целью при массивных кровотечениях. Плазма также обладает гемостатическим действием. Тромбоцитная масса применяется при кровотечениях на фоне тромбоцитопении","sec":"qa"},{"t":"Гормональные препараты (питуитрин, окситоцин) при гипотонических маточных кровотечениях. Кровотечение - быстро развивающ","d":"жизни. Поэтому действия хирурга для спасения больного должны быть быстрыми и четкими. Лечебный алгоритм:1. Остановка кровотечения.2. Восполнение кровопотери. 60. Трансфузиология. Организация трансфузиологической службы России. Переливание крови (transfusion) — введение с лечебной целью в сосудистое русло реципиента крови донора или ее компонентов, а также белковых препаратов крови. Весьма распространенная и очень ответственная…","sec":"qa"},{"t":"При помощи специальных аппаратов: а) перекачивание крови системой трубок со шприцем; б) аппаратами-шприцами с кранами и ","d":"в) аппаратами с двумя шприцами, соединенными с переключателем; г) аппаратами с реконструированными шприцами; д) аппаратами, работающими по принципу отсасывания и непрерывного перекачивания крови. II. Непрямое (опосредованное) переливание крови","sec":"qa"},{"t":"Переливание цельной крови (без добавления к нейстабилизаторов и без ее обработки): а) применение парафинированных сосудо","d":"в) применение силиконированных сосуд ром эндогенной интоксикации — общая реакция организма, проявляющаяся характерными изменениями морфологического и биохимического состава крови. Все они имеют обусловленную патогенезом инфекции общую причину —…","sec":"qa"},{"t":"Дисгормональный эндотоксикоз обусловлен нейрогормональными факторами, вызывающими повышенный выброс гормонов патологичес","d":"Клиническая картина При острой эндогенной интоксикации, если с самого начала микрофлора инфекционно-воспалительного очага представлена грамотрицательными микроорганизмами, общие проявления инфекции могут запаздывать (из-за отсутствия эндотоксина) и достигать клинической выраженности только после активного размножения возбудителей в очаге, с поступлением значительного количества эндотоксина в сосудистое русло. В особо тяжелых…","sec":"qa"},{"t":"Вытяжение следует проводить в среднефизиологическом положении повреждённой конечности, т.е. в состоянии равновесия между","d":"полусогнутым положением конечности, уложенной на шины Белера, Богданова (рис. 79)","sec":"qa"},{"t":"Необходимо создание противотяги, что достигается, например, приподниманием ножного конца кровати при лечении переломов н","d":"масса тела больного создаёт противотягу. 111. Оперативное лечение переломов. Оперативное лечение переломов Различают абсолютные и относительные показания к оперативному лечению переломов. Абсолютные показания: 1) открытые переломы; 2) повреждение жизненно важных органов отломками костей (вещества головного,спинного мозга, органов грудной и брюшной полостей, крупных сосудов, нервов конечностей); 3) интерпозиция мягких тканей…","sec":"qa"},{"t":"Специфическая: а) туберкулёз; б) столбняк; в) газовая гангрена; г) актиномикоз; д) сибирская язва; е) дифтерия ран","d":"II. Этиология: а) стафилококковая; б) стрептококковая; в) пневмококковая; г) колибациллярная; д) гонококковая; е) анаэробная неспорообразующая; ж) клостридиальная анаэробная; з) смешанная; и) грибковая и др. III. Структура патологии: а) инфекционные хирургические болезни; б) инфекционные осложнения хирургических болезней; в) послеоперационные инфекционные осложнения; г) инфекционные осложнения закрытых и открытых травм. IV.…","sec":"qa"},{"t":"Хроническая гнойная инфекция. 119. Общие принципы диагностики и лечения острой гнойной хирургической инфекции. Патогенез","d":"Диагностика Из лабораторных тестов, характеризующих интоксикацию, большое значение имеет увеличение в крови уровня мочевины, некротических тел, полипептидов, ЦИК, протеолитической активности сыворотки крови. Тяжёлая интоксикация проявляется также нарастающей анемией, сдвигом влево лейкоцитарной формулы, появлением токсической зернистости форменных элементов крови, развитием гипо- и диспротеинемии. Для уточнения диагноза…","sec":"qa"},{"t":"Применение ГБО. 123. Фурункул, фурункулез. Этиопатогенез. Клиническая картина. Лечение","d":"Фурункул Фурункул (furunculus) - острое гнойно-некротическое воспаление волосяного фолликула, сальной железы и окружающей подкожной жировой клетчатки. Наиболее частой локализацией фурункулов являются задняя поверхность шеи, предплечья, тыльная сторона кисти, лицо, бедро. Появление двух и более фурункулов свидетельствует о фурункулёзе. В возникновении фурункулов играют роль микротравмы, например расчёсы кожи при заболеваниях,…","sec":"qa"},{"t":"При глубоких отеках имеется отек непораженных нижележащих отделов. 153. Клиника и диагностика степени ожога","d":"Определение глубины и площади ожогов Алгоритм диагностики глубины поражения тканей при ожогах складывается из следующих положений: 1. сбор анамнеза: причинный агент, вызвавший ожог, его физические свойства, температура в момент воздействия, экспозиция, характер одежды, пол и возраст пострадавшего, локализация поражения, сопутствующие заболевания, содержание первой помощи; 2. осмотр раны: выявление прямых и косвенных признаков…","sec":"qa"},{"t":"Борьба с болью: - создание покоя, обработка вазелином (мазью) и наложение повязок; - таблетированные ненаркотические ана","d":"нейролептиков; - наркотические анальгетики","sec":"qa"},{"t":"Лечение ожогового шока: - обеспечение проходимости дыхательных путей; - катетеризация центральной вены и начало инфузии;","d":"катетеризация мочевого пузыря; - введение зонда в желудок","sec":"qa"},{"t":"Предупреждение и лечение инфекционных осложнений: - антибактериальная терапия; - стимуляция иммунной системы 157. Хирург","d":"Оперативное лечение глубоких ожогов состоит из некротомий, некрэктомии и различных видов кожной пластики. Некротомия — рассечение некротического струпа для устранения его сдавливающего действия при обширных циркулярных ожогах Шб — IV степени грудной клетки или конечностей. Некротомия — удаление омертвевших тканей, в частности некротиче­ского ожогового струпа. Она может быть первичной (в первые дни после ожога) и вторичной (при…","sec":"qa"},{"t":"Воздействие низких температур при сухом морозе (обычно при температуре ниже —10 °С) вызывает повреждение клеточной прото","d":"некроз или дегенерация тканей. Клинически отморожение проявляется побелением отмороженных участков","sec":"qa"},{"t":"При непосредственном контакте с предметами, имеющими очень низкую температуру (в пределах от —30 до —40 °С) наступает ги","d":"отморожения наблюдается у летчиков и танкистов, которые по роду службы вынуждены бывают прикасаться к сильно охлажденным приборам незащищенными руками. Часто на руках отпечатываются формы тех предметов, к которым прикасался отмороженный. 3.Умеренное длительное охлаждение нижних конечностей при невозможности просушить обувь грозит отморожением стоп с особой клинической картиной — «траншейной стопой»; наблюдается у военнослужащих,…","sec":"qa"},{"t":"Генетические дефекты – гаметопатии - обусловлены мутацией на генном и хромосомном уровне: а) моногенные аномалии – при д","d":"б) множественные – при хромосомных и полигенных мутациях. II.- Внешние","sec":"qa"},{"t":"Инфекционные тератогенные факторы – а) заболевания вирусной природы(ветряная оспа, корь, герпес, вир гепатит, полиомелит","d":"в) протозойные(токсоплазмоз, листериоз, цитомегаловирус)","sec":"qa"},{"t":"Физические факторы – механические травмы, вибрация, ионизирующее излучение, перегревание, переохлаждение и др","d":"Классификация врожденных пороков I. Изменение размеров органов","sec":"qa"},{"t":"Аплазия(агенезия) – полное отсутствие органа. II. Изменение формы органов: Косолапость, подковообразная почка, двурогая ","d":"щитовидная железа). IV. Увеличение количества органов: полидактилия, гермафродитизм, добавочные ребра. V. Атавизмы: срединная, боковая киста шеи, свищи; VI. Дуплицирующие аномалии: сросшиеся близнецы. Пороки развития костей черепа Пороки развития костей черепа: 1. непостоянные (вставочные, вормиевы) кости швов, кости родничков; 2. непостоянные швы (метопический, внутритеменной, ложный); 3. большие теменные отверстия, тонкая…","sec":"qa"},{"t":"Чрезвычайно редкий порок развития — полное отсутствие лица — апрозопия. 2. отсутствия среднего отдела лица и носа, при к","d":"находятся в одном общем углублении — циклопия. 3. Агнатия — полное отсутствие нижнего отдела лица с нижней челюстью, сочетающееся со сближением ушных раковин, также встречается весьма редко. 4. врожденные расщелины. Форма и локализация расщелин зависят от того, между какими зародышевыми буграми не наступило сращение. Из пороков развития губ чаще встречаются расщелины: 1 - срединная (нарушения срастания нижнечелюстных отростков), 2…","sec":"qa"},{"t":"Часто встречаются аномалии уздечки языка — увеличение площади соединения ее с нижней поверхностью языка или укорочение. ","d":"25 Робена синдром — врожденный порок развития, характеризующийся тремя основными клиническими прзнаками: 1.недоразвитием нижней челюсти (нижней микрогнатией), 2.глоссоптозом (недоразвитием и западением языка) и 3. наличием расщелины неба. Макростомия (macrostomia) – незаращение угла рта с одной или обеих сторон, чрезмерно широкая ротовая щель. При этом нарушается питание, отмечается постоянное слюнотечение, раздражение и…","sec":"qa"},{"t":"Кифоз (kyphosis) – обусловлен деформацией позвоночника. Лечение должно быть строго индивидуальным, с учетом как вида деф","d":"так и функционального состояния органов кровообращения и дыхания. При пороках развития большой грудной мышцы лечение обычно преследует лишь устранение косметического дефекта. Ношение специального пелота в большинстве случаев позволяет достичь эффективной коррекции при пороках развития грудины. Однако если размеры дефекта значительны, может потребоваться оперативное вмешательство, которое заключается в пересадке на место дефекта…","sec":"qa"},{"t":"Мулътикистозная почка — тотальное замещение паренхимы кистозными образованиями; 3. мулътилокулярная киста — многокамерна","d":"полюсов почки; 4. поликистоз почек — двусторонняя аномалия, характеризующаяся замещением почечной паренхимы множественными кистами («грозди винограда»); 5. солитарные кисты (простая, дермоидная); 6. паравезикальная киста — одиночное кистозное образование, локализующееся в области почечного синуса, ворот почки; 7. лоханочная киста — локализуется в паренхиме почки и сообщается с просветом лоханки почки; 8. чашечная киста; 9.…","sec":"qa"},{"t":"Врожденные клапаны мочеиспускательного канала — перепонки, покрытые с обеих сторон слизистой оболочкой; располагаются в ","d":"холмика. Лечение заключается в трансуретральной резекции клапана","sec":"qa"},{"t":"Врожденная облитерация мочеиспускательного канала: при облитерации наружное отверстие мочеиспускательного канала рассека","d":"ликвидирована туннелизацией. В случаях обширной облитерации или атрезии радикальное лечение заключается в уретропластике. 4.Врожденные сужения мочеиспускательного канала чаще всего наблюдаются в дистальном отделе. При отсутствии эффекта от бужирования мочеиспускательного канала выполняют резекцию суженного участка и сшивание нормальных участков. 5. Удвоение мочеиспускательного канала: выполняют облитерацию, электрокоагуляцию или…","sec":"qa"},{"t":"В стационары больниц госпитализируются пациенты, нуждающиеся в квалифицированном обследовании и","d":"стационарном лечении по направлению врачей амбулаторно-поликлинических учреждений, скорой и неотложной медицинской помощи, а также больные по жизненным показаниям без направления организаций здравоохранения","sec":"qa"},{"t":"При поступлении в стационар по направлению амбулаторно-поликлинического учреждения пациент (лицо, сопровождающее больног","d":"установленной формы, документ удостоверяющий личность, выписку из истории болезни","sec":"qa"},{"t":"Приём больных в стационар производится в приёмном отделении, где должны быть созданы все необходимые условия для своевре","d":"Здесь производится тщательный осмотр и необходимое для уточнения диагноза обследование больного,, устанавливается предварительный диагноз и решается вопрос о том, в какое специализированное отделение он должен быть госпитализирован, о чём делается соответствующая запись в истории болезни","sec":"qa"},{"t":"Плановая и экстренная госпитализация при нахождении 'больного в приемном отделении должна быть обеспечена в оптимально к","d":"ной медицинской помощи; 4.2. Плановые больные оформляются с 8,00 до 14.00, предъявляя дежурной медсестре направление, паспорт, страховой полис; 4.3. Госпитализация по самообращению пациента осуществляется при состояниях угрожающих его жизни; 4.4. При плановой госпитализации в направлении больного должны быть указаны догоспитальные обследования в т. ч,флюорографические и гинекологические, цель и задачи, объективный статус; 4.5.…","sec":"qa"},{"t":"Всем больным проводится определение температуры, артериального давления, частоты пульса, массы тела, роста, осмотр на пе","d":"врачом. Санитарная обработка проводится младшим или средним медицинским персоналом,","sec":"qa"},{"t":"При отсутствии медицинских показаний для стационарного лечения иди отказе больного от госпитализации после проведения ди","d":"оказания медицинской помощи дежурный врач заполняет журнал отказов отгоспитализации Ф. №001/у, где поясняет причину отказа и принятых мерах. Передается активный вызов в поликлинику, о чем фиксируется в Ф. №001/у, с отметкой ФИО передавшего и принявшего вызов","sec":"qa"},{"t":"При выявлении в приемном отделении диагноза инфекционного заболевания составляется «экстренное извещение» Ф. №058/у, кот","d":"Ф. №060/у и не позднее 2 часов передается в ЦГСЭН","sec":"qa"},{"t":"При отсутствии документов и невозможности установления личности больного, данные о «неизвестном» сообщаются телефонограм","d":"телефонограмм, с отметкой времени подачи и ФИО принявшего и передавшего сообщение. Так же передаются сведения обо всех ДТП, травмах и повреждениях насильственного характера","sec":"qa"},{"t":"Дежурный врач приемного отделения обязан известить родственников больного в следующих случаях: - При поступлении в больн","d":"При доставке скорой помощью по поводу несчастных случаев; - При поступлении больных в бессознательном состоянии (при наличии документов); - При переводе больного в другую больницу непосредственно из приемного отделения; - В случае смерти больного в приемном отделении","sec":"qa"},{"t":"Выписка больного производится лечащим врачом по согласованию с заведующим отделением стационара. Выписка из больницы раз","d":"при стойком улучшении, когда по состоянию здоровье больной может без ущерба для здоровья продолжать лечение в амбулаторно-поликлиническом учреждении или домашних условиях; - при необходимости перевода больного в другую организацию здравоохранения; - по письменному требованию больного или его законного представителя до излечения, если выписка не угрожает жизни больного и не опасна для окружающих. В этом случае выписка может быть…","sec":"qa"},{"t":"Перед выпиской из стационара в необходимых случаях производится заключительный осмотр больного и в день его выбытия из с","d":"и диагноза или эпикриз (выписка из истории болезни), листок временной нетрудоспособности. Первый экземпляр эпикриза вклеивается в медицинскую карту стационарного больного, второй экземпляр направляется в территориальную поликлинику по месту жительства, а третий экземпляр по медицинским показаниям дается на руки пациенту","sec":"qa"},{"t":"Госпитализация больных в дневной стационар организаций здравоохранения осуществляется в соответствии с порядком, приняты","d":"пребыванием. +15. Лечение пациентов осуществляется бесплатно в рамках Программы государственных гарантий оказания бесплатной медицинской помощи гражданам Российской Федерации. 201. Критерии операционного анестезиологического риска. Оценка операционно-анестезиологического риска Хирургическая операция и анестезия представляют для больного потенциальную опасность. Поэтому объективная оценка операционно-анестезиологического риска…","sec":"qa"},{"t":"Канюля катетера закрывается специальным резиновым колпачком. Катетер крепится к коже полосками пластыря","d":"203. Предоперационная подготовка больных к плановым хирургическим операциям. Подготовка больного к плановой операции При плановых хирургических операциях у лечащего врача и анестезиолога имеется достаточное для обследования время (дни, недели и даже месяцы перед операцией). При проведении плановой операции не должно возникнуть никаких угрожающих жизни и здоровью больного осложнений. При плановой операции больной по той же причине…","sec":"qa"},{"t":"Мазок на дизгруппу Необходимо посистемное обследование пациента","d":"При выявлении признаков патологии со стороны жизненно важных органов и систем проводится их детальное исследование. Могут выполняться рентгенологические исследования, компьютерная томография, ангиографические исследования, биохимические анализы и т.д. Зачастую данные исследования могут повлиять тактику лечения хирургического больного. Так же, как при экстренной операции больному должны объяснить суть предполагающейся операции,…","sec":"qa"}]},
  {id:"gig",course:3,icon:"flask",name:"Гигиена",desc:"Лечебное дело, 3 курс. Карточки вопрос-ответ по экзамену",c:"150,210,180",cd:"40,140,90",tests:[],cards:[{"t":"Определение понятий «здоровье», «санитария», первичная, вторичная, третичная профилактика. Связь гигиены с биологическим","d":"По определению экспертов Всемирной организации здравоохранения (ВОЗ): «Здоровье – это состояние полного физического, душевного и социального благополучия, а не только отсутствие болезней или физических дефектов». «Санитария» (от латинского sanitas – здоровье) – это область практической деятельности, направленная на реализацию научно обоснованных гигиенической наукой профилактических мероприятий с целью повышения уровня здоровья…","sec":"qa"},{"t":"Предмет, цель, содержание, объекты и задачи общей гигиены. Место гигиены в системе медицинского образования","d":"Гигиена – медицинская, профилактическая дисциплина – наука, изучающая влияние факторов среды обитания и условий жизнедеятельности на здоровье людей, и разрабатывающая на этой основе соответствующие профилактические мероприятия. Предметами гигиены являются окружающая среда и здоровье. Окружающая среда представляет собой совокупность элементов физического, химического, биологического, психологического, экономического,…","sec":"qa"},{"t":"История развития гигиены. Роль врачей клиницистов в развитии профилактического направления в медицине","d":"Гигиена одна из древнейших областей знаний человечества с точки зрения истории. Всю историю развития гигиены, от гигиенических знаний до гигиены как науки, можно разделить на определенные периоды. Гигиена как наука сформировалась в конце 19 века и у нас и в Западной Европе. Родоначальник – немецкий ученый Макс Петенкофер – работал над созданием экспериментального метода. В России Доброславин в 1871 году возглавил кафедру общей и…","sec":"qa"},{"t":"Становление и развитие гигиены в Европе. Гиппократ, Салернская медицинская школа, Б. Раммаццини, М. Петтенкофер","d":"Началом зарождения и формирования гигиены является эмпирический этап накопления гигиенических знаний, норм и правил. Имена подвижников того времени большей частью неизвестны, однако их знания, опыт и навыки стали в последующем достоянием таких выдающихся деятелей и врачевателей древности, как Гиппократ, Авиценна, Маймонид, которые сумели донести до современников весь предшествующий опыт в виде научных трудов, манускриптов, правил…","sec":"qa"},{"t":"Основоположники гигиены в России. Доброславин, Эрисман, Якобий. Первая самостоятельная кафедра гигиены в России. А.И","d":"Якобий. Основные этапы развития гигиенической науки в России. Дифференциация гигиены. В России гигиена начинает преподаваться в 1798 г. после открытия Медико-хирургической академии Петербурга, как курс судной науки (судебной медицины). Сначала этот курс назывался «Медицинская полиция», а с 1835 г. «Медицинская полиция и гигиена». Самостоятельная кафедра гигиены в академии и первая в России открывается в 1871 г. под руководством…","sec":"qa"},{"t":"Строение земной атмосферы. Характеристика свойств ее основных частей","d":"Строение земной атмосферы различно на разных уровнях от поверхности земли. Нижней границей является поверхность земли, верхний предел точно не установлен, полагают, что он достигает 1300 км. Атмосфера имеет выраженное слоистое строение и включает тропосферу, стратосферу, ионосферу. Тропосфера - это наиболее плотные воздушные слои, прилегающие к земной поверхности. Ее толщина над различными широтами земного шара неодинакова: в…","sec":"qa"},{"t":"Физические факторы воздушной среды: температура, влажность, подвижность воздуха, их влияние на теплообмен организма, раб","d":"Действие воздушной среды на организм является комплексным. Физические свойства воздуха (температура, влажность, подвижность воздуха, барометрическое давление, электрическое состояние) в значительно степени определяют теплообмен организма с окружающей средой, который поддерживается путем уравновешивания процессов химической и физической терморегуляции. Организм отдает тепло путем проведения, конвекции, излучения и испарения пота.…","sec":"qa"},{"t":"Микроклимат помещений, факторы его формирующие и принципы нормирования. Виды терморегуляции. Пути и механизмы теплоотдач","d":"В гигиенической практике значительное внимание уделяется исследованию микроклимата, под которым понимают состояние воздушной среды, определяемое комплексом физических факторов (атмосферное давление, температура, влажность, скорость движения воздуха, лучистое тепло) в ограниченном пространстве, оказывающее влияние на терморегуляцию организма. В больницах, школах, общественных и жилых зданиях, а также на производстве при…","sec":"qa"},{"t":"Виды микроклимата и влияние дискомфортного микроклимата на теплообмен и здоровье человека (переохлаждение и перегревание","d":"Методы исследования температуры, влажности и скорости движения воздуха Микроклимат производственных помещений характеризуется большим разнообразием сочетаний температуры, влажности, скорости движения воздуха, интенсивности и состава лучистого тепла, отличается динамичностью и зависит от колебания внешних метеоусловий, времени дня и года, хода и характера производственного процесса, условий воздухообмена с атмосферой. Если говорить…","sec":"qa"},{"t":"Хроническая гипотермия: понижение работоспособности, понижение сопротивляемости организма к неблагоприятным факторам Исс","d":"своему назначению разделяются на измеряющие (спиртовые, ртутные, электрические), рассчитанные на определение температуры в момент наблюдения, и фиксирующие (минимальные и максимальные), позволяющие получить минимальное или максимальное значение температуры за определенный период времени (сутки, неделю и т. д.). Максимальный (ртутный) термометр используется для фиксирования самой высокой температуры за определенный отрезок времени.…","sec":"qa"},{"t":"Прямые ртутно-кварцевые лампы ПРК (ДРТ—дуговые ртутно-кварцевые лампы) являются мощными источниками излучения в ультрафи","d":"находится в ультрафиолетовы function tone(f,dur,type,vol,delay,slide){const c=ac();if(!c)return;const t=c.currentTime+(delay||0);const o=c.createOscillator(),g=c.createGain();o.type=type||"sine";o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(f*slide,t+dur);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol||.06,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+dur+.03);}
function whoosh(d){const c=ac();if(!c)return;const len=Math.floor(c.sampleRate*d);const b=c.createBuffer(1,len,c.sampleRate);const ch=b.getChannelData(0);for(let i=0;i<len;i++){const env=Math.sin(Math.PI*i/len);ch[i]=(Math.random()*2-1)*env;}const s=c.createBufferSource();s.buffer=b;const f=c.createBiquadFilter();f.type="bandpass";f.frequency.setValueAtTime(900,c.currentTime);f.frequency.exponentialRampToValueAtTime(2600,c.currentTime+d);f.Q.value=.9;const g=c.createGain();g.gain.value=.05;s.connect(f);f.connect(g);g.connect(c.destination);s.start();}

  return `<svg viewBox="-1 -1 ${N+2} ${N+2}" shape-rendering="crispEdges" role="img" aria-label="QR-код для оплаты"><rect x="-1" y="-1" width="${N+2}" height="${N+2}" fill="#fff"/><g fill="#0b1630">${m}</g>${fin(0,0)}${fin(N-7,0)}${fin(0,N-7)}<defs><linearGradient id="sbpg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5b57a2"/><stop offset=".5" stop-color="#1d9bd7"/><stop offset="1" stop-color="#0f9d58"/></linearGradient></defs><rect x="11.6" y="11.6" width="5.8" height="5.8" rx="1.4" fill="url(#sbpg)" shape-rendering="geometricPrecision"/></svg>`;}
function ecgPath(){let d="M0 60";for(let b=0;b<4;b++){const x=b*300;d+=` L${x+60} 60 Q${x+75} 47 ${x+90} 60 L${x+118} 60 L${x+126} 68 L${x+136} 10 L${x+146} 80 L${x+154} 60 L${x+188} 60 Q${x+211} 40 ${x+234} 60 L${x+300} 60`;}return d;}

function vTest(){
  const q=T.qs[T.i],n=T.qs.length,s=subById(q.sid),done=T.i+(T.answered?1:0);
  const multi=Array.isArray(q.a),need=multi?q.a.length:1;
  const isRight=k=>multi?q.a.includes(k):k===q.a;
  const opts=q.opts.map((o,k)=>{let cls="opt",mark="АБВГДЕ"[k]||"";const chosen=multi?T.sel.includes(k):k===T.picked;
    if(T.answered){if(isRight(k)){cls+=" ok";mark=ic("check",16,2.6);}else if(chosen){cls+=" bad";mark=ic("x",16,2.6);}else cls+=" dim";}
    else if(multi&&chosen){cls+=" sel";mark=ic("check",16,2.6);}
    return `<button class="${cls}" data-act="${multi?"toggle":"pick"}" data-arg="${k}" ${T.answered?"disabled":""}><span class="lt">${mark}</span><span class="tx">${o}</span></button>`;}).join("");
  const right=T.right;
  const checkBtn=multi&&!T.answered?`<div class="dock"><button class="btn" id="chk" data-act="check" ${T.sel.length===need?"":"disabled"}>Проверить</button></div>`:"";
  const tail=checkBtn+(T.answered?`<div class="glass explain ${right?"is-ok":"is-bad"}"><div class="ex-h">${right?"Верно":"Неверно"}</div><p>${q.e||"Правильный ответ подсвечен зелёным. Ответ подтверждён в системе тестирования."}</p></div>
    <div class="dock"><button class="btn" data-act="next">${T.i===n-1?"Показать результат":"Следующий вопрос"}</button></div>`:"");
  return `<div class="topbar"><button class="icon-btn" data-act="quit" aria-label="Закрыть">${ic("x",18,2)}</button>
      <div class="bar"><i style="width:${done/n*100}%"></i></div><div class="count">${T.i+1} / ${n}</div></div>
    <div class="q-meta">${T.mix?"Микс, "+s.name:s.name}${q.sec?`, ${secName(s,q.sec)}`:""}${q.n&&s.src?`, ${s.src} №${q.n}`:""}</div>
    <h2 class="q">${q.q}</h2>
    ${multi?`<span class="need">${ic("check",14,2.4)}Выбери ${need} ${need<5?"ответа":"ответов"}</span>`:""}
    <div class="opts">${opts}</div>${tail}`;
}

const EMAIL_RE=/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;
function showErr(t){const e=document.getElementById("err");if(e)e.textContent=t||"";}
function sendCode(){const v=(document.getElementById("email").value||"").trim().toLowerCase();if(!EMAIL_RE.test(v)){showErr("Проверь адрес почты");sfx("bad");buzz(30);return;}pendingEmail=v;sfx("send");go("code");toast("Код отправлен",esc(v),"mail");}
function setupOtp(){const boxes=[...view.querySelectorAll(".otp input")];const vb=document.getElementById("verify");
  const check=()=>{vb.disabled=boxes.some(b=>!b.value);};
  boxes.forEach((b,i)=>{
    b.addEventListener("input",()=>{b.value=b.value.replace(/\D/g,"").slice(-1);if(b.value){sfx("tap");if(i<5)boxes[i+1].focus();}check();if(boxes.every(x=>x.value))verify();});
    b.addEventListener("keydown",e=>{if(e.key==="Backspace"&&!b.value&&i>0){boxes[i-1].focus();boxes[i-1].value="";check();}});
    b.addEventListener("paste",e=>{const t=((e.clipboardData||window.clipboardData).getData("text")||"").replace(/\D/g,"").slice(0,6);if(t){e.preventDefault();t.split("").forEach((c,j)=>{if(boxes[j])boxes[j].value=c;});boxes[Math.min(t.length,5)].focus();check();if(t.length===6)verify();}});
  });
  setTimeout(()=>boxes[0]&&boxes[0].focus(),380);startResend();}
function startResend(){let left=30;const upd=()=>{const b=document.getElementById("resend");if(!b){clearInterval(resendT);resendT=null;return;}if(left>0){b.disabled=true;b.textContent=`Отправить ещё раз через ${left} с`;left--;}else{b.disabled=false;b.textContent="Отправить код ещё раз";clearInterval(resendT);resendT=null;}};if(resendT)clearInterval(resendT);upd();resendT=setInterval(upd,1000);}
function verify(){if(verifying)return;const boxes=[...view.querySelectorAll(".otp input")];const code=boxes.map(b=>b.value).join("");if(code.length<6){document.getElementById("otp").classList.add("shake");return;}
  verifying=true;const vb=document.getElementById("verify");vb.disabled=true;vb.textContent="Проверяем";setTimeout(()=>{verifying=false;login();},750);}

  if(isNew){DB.accounts[e]=acctDefault(e);const g=DB.accounts.__guest;if(g&&(g.answers||totalKnown(g)||g.blitzBest)){PROGRESS.forEach(k=>{DB.accounts[e][k]=JSON.parse(JSON.stringify(g[k]));});DB.accounts[e].skin=g.skin;delete DB.accounts.__guest;setTimeout(()=>toast("Прогресс перенесён","Результаты гостевого режима теперь в аккаунте","refresh"),500);}}
  DB.session=e;bindA();save();sfx("ok");buzz(15);

function startTest(sid,sec){const s=subById(sid);const qs=availIdx(s,"tests").filter(i=>!sec||s.tests[i].sec===sec).map(i=>Object.assign({sid},s.tests[i]));if(!qs.length){go("paywall");return;}T={sid,sec:sec||null,mix:false,qs:shuffle(qs).slice(0,20),i:0,correct:0,answered:false,picked:null,sel:[],right:false};A.last={sid,kind:"test"};save();go("test");}
function startMix(){const all=[];DATA.forEach(s=>availIdx(s,"tests").forEach(i=>all.push(Object.assign({sid:s.id},s.tests[i]))));T={sid:null,mix:true,qs:shuffle(all).slice(0,10),i:0,correct:0,answered:false,picked:null,sel:[],right:false};go("test");}
function pick(k,el){if(!T||T.answered)return;const q=T.qs[T.i];const r=el.getBoundingClientRect();T.answered=true;T.picked=k;T.right=k===q.a;A.answers++;
  if(k===q.a){A.correct++;T.correct++;sfx("ok");buzz(12);}else{sfx("bad");buzz([30,40,30]);}
  activity(1);render(false);if(k===q.a)sparks(r.left+32,r.top+r.height/2,14);checkAch();
  requestAnimationFrame(()=>{const d=view.querySelector(".dock");if(d)d.scrollIntoView({behavior:reduced()?"auto":"smooth",block:"end"});});}
function nextQ(){if(T.i<T.qs.length-1){T.i++;T.answered=false;T.picked=null;T.sel=[];T.right=false;render(true);}else finishTest();}
function toggleOpt(k,el){if(T.answered)return;const q=T.qs[T.i];const i=T.sel.indexOf(k);if(i>=0)T.sel.splice(i,1);else{if(T.sel.length>=q.a.length)T.sel.shift();T.sel.push(k);}sfx("tap");buzz(6);render(false);}
function checkMulti(el){const q=T.qs[T.i];if(T.answered||T.sel.length!==q.a.length)return;const r=el.getBoundingClientRect();T.answered=true;
  const ok=T.sel.length===q.a.length&&T.sel.every(x=>q.a.includes(x));T.right=ok;A.answers++;
  if(ok){A.correct++;T.correct++;sfx("ok");buzz(12);}else{sfx("bad");buzz([30,40,30]);}
  activity(1);render(false);if(ok)sparks(r.left+r.width/2,r.top+r.height/2,16);checkAch();
  requestAnimationFrame(()=>{const d=view.querySelectorAll(".dock");const last=d[d.length-1];if(last)last.scrollIntoView({behavior:reduced()?"auto":"smooth",block:"end"});});}
function finishTest(){const n=T.qs.length,pct=Math.round(T.correct/n*100);A.tests++;if(pct===100)A.perfect++;let nb=false;
  if(!T.mix){A.tested[T.sid]=1;const bk=T.sec?T.sid+":"+T.sec:T.sid;const prev=A.best[bk];if(prev==null||pct>prev){nb=prev!=null;A.best[bk]=pct;}if(T.sec&&(A.best[T.sid]==null||pct>A.best[T.sid]))A.best[T.sid]=pct;}R_SEC=T.sec;
  save();R={pct,correct:T.correct,n,sid:T.sid,sec:T.sec,mix:T.mix,newBest:nb};go("result");if(pct>=85){sfx("achieve");confetti();}checkAch();}
function startCards(sid){const s=subById(sid);C={sid,order:shuffle(availIdx(s,"cards")),i:0,k:0,l:0};A.last={sid,kind:"cards"};save();go("cards");}

  A.known[C.sid]=[...set];activity(1);checkAch();if(C.i<C.order.length-1){C.i++;render(false);}else go("cardsDone");}

function startSlides(){const items=isPro()?SLIDES:SLIDES.slice(0,FREE_SLIDES);SL={items:shuffle(items).map(s=>Object.assign({},s,makeOpts(s.name))),i:0,ok:0,answered:false,picked:null,zoom:false,ox:50,oy:50};go("slides");}
